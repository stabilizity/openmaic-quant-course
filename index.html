ight:400;text-align:left;margin-bottom:5px;\">高换手因子的超额，常被成本吃掉大半\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">要计入：佣金、印花税、冲击成本、冲击容量\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">纪律：先算清成本再谈因子；同时评估资金容量上限\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-13-note","type":"text","left":56,"top":400,"width":890,"height":42,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">一句话总结：\u003cstrong>回测不是\"跑通了\"，而是\"排除了所有已知的乐观偏差之后，还剩多少\"。\u003c/strong>这是公募私募与散户方法论上最大的分水岭。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"多因子的难点不在公式，而在工程细节。第一，时点对齐：财报是四月公布的，你却在三月用上了全年利润，这叫前视偏差，会让回测收益凭空翻倍。第二，幸存者偏差：退市和更名的股票如果被剔除，历史收益就被系统性高估。第三，中性化：不剥离行业和市值的影响，你的\"因子\"可能只是在赌小盘股。第四，换手成本：高换手因子在扣掉手续费和冲击成本之后，超额收益常常所剩无几。"}}},{"id":"sc-14","stageId":"stg-quant-strategy-taxonomy","title":"测验 · 多因子与回测陷阱","order":14,"type":"quiz","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-14-sp","type":"speech","text":"这组题不是考概念，是考\"怀疑精神\"。以后看到任何漂亮的回测曲线，都可以用第 4 题的三问去拆它。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-14.mp3"}],"content":{"type":"quiz","questions":[{"id":"sc-14-q1","type":"single","points":2,"hasAnswer":true,"question":"在 3 月末的回测中使用上一年的年报利润，而该年报 4 月才公告，这属于？","options":[{"label":"数据清洗问题","value":"A"},{"label":"前视偏差（未来函数）","value":"B"},{"label":"幸存者偏差","value":"C"},{"label":"中性化不足","value":"D"}],"answer":["B"],"analysis":"在决策时点使用了当时尚不可得的信息，即为前视偏差。它会让回测收益虚高，实盘无法复现。"},{"id":"sc-14-q2","type":"single","points":2,"hasAnswer":true,"question":"回测股票池只包含\"当前仍在上市\"的股票，会带来什么偏差？","options":[{"label":"前视偏差","value":"A"},{"label":"幸存者偏差，历史收益被高估","value":"B"},{"label":"只会低估波动率，不影响收益","value":"C"},{"label":"没有任何影响","value":"D"}],"answer":["B"],"analysis":"退市、被并购、更名的样本被系统性排除，剩下的都是\"活下来的赢家\"，历史表现被高估。"},{"id":"sc-14-q3","type":"multiple","points":3,"hasAnswer":true,"question":"关于\"纯多头多因子\"与\"市场中性多因子\"，下列说法正确的是？（多选）","options":[{"label":"纯多头同时承担选股能力与大盘涨跌的收益与风险","value":"A"},{"label":"市场中性通过对冲剥离大盘方向，更纯粹地暴露选股能力","value":"B"},{"label":"市场中性不需要做空工具与额外成本","value":"C"},{"label":"两种形态的收益来源不完全相同","value":"D"}],"answer":["A","B","D"],"analysis":"市场中性必须依赖做空工具（融券、股指期货、收益互换等），有额外成本与约束，这也是它的重要实操门槛。"},{"id":"sc-14-q4","type":"short_answer","points":5,"hasAnswer":true,"question":"如果有人说\"我的多因子策略回测年化 60%、回撤 5%\"，你最该追问哪三件事？","answer":["数据时点","是否包含退市股票","交易成本与滑点","样本外检验","资金容量"],"commentPrompt":"评分要点：任答三点即可，例如 (1) 数据是否按公告日对齐、有无未来函数；(2) 是否包含退市股票；(3) 是否计入手续费/印花税/冲击成本；(4) 样本外与不同市场是否复验过；(5) 策略容量与换手率。","analysis":"极端漂亮的回测，绝大多数是数据或成本口径问题。用\"时点、样本、成本、样本外\"四问过滤，能排掉大半虚假结果。"}]}},{"id":"sc-15","stageId":"stg-quant-strategy-taxonomy","title":"套利族：赚价差收敛，不赌方向","order":15,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-15-sp","type":"speech","text":"第四类，套利。核心是同一资产在不同市场、不同合约之间的价格偏差：不赌方向，只赚价差收敛。四种常见形态：ETF 折溢价、期现套利、跨期套利、可转债套利。它的特点是风险低、与大盘涨跌基本无关，但机会稀少、资金门槛高，而且随着参与者变多，价差窗口越来越短。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-15.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-15-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-15-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第五节 · 套利\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-15-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">低风险、低相关，但机会稀少且门槛高\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-15-c1","type":"text","left":56,"top":165,"width":208,"height":286,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">① ETF 折溢价\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">折价：场内价 \u003c 净值 → 场内买入，赎回一篮子股票卖出\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">溢价：场内价 > 净值 → 买入一篮子股票申购，场内卖出\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">门槛：股票 ETF 申赎有最小份额要求（通常数十万份级），以基金合同为准\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-15-c2","type":"text","left":280,"top":165,"width":208,"height":286,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">② 期现套利\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">股指期货价格与现货指数价差过大时反向对冲\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">价差收敛即平仓\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">需计入：资金成本、保证金占用、基差波动、交割与流动性\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">本质：赚\"期货定价错误 + 资金成本差\"\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-15-c3","type":"text","left":504,"top":165,"width":208,"height":286,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">③ 跨期套利\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">同一品种远近月合约价差偏离合理区间\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">近远月反向开仓，等价差回归\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">商品期货经典；受仓储、交割、季节性影响\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">风险：极端行情下近远月价差可以持续扩大\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-15-c4","type":"text","left":728,"top":165,"width":216,"height":286,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">④ 可转债套利\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">转债同时具备债性 + 股性\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">正股大涨、转债低估 → 买入或转股套利\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">转股溢价率过高时反向操作\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">风险：正股停牌、转股期限制、流动性\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-15-note","type":"text","left":56,"top":463,"width":890,"height":65,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">共同前提：\u003cstrong>必须有可执行的第二条腿与足够低的交易成本\u003c/strong>。套利机会一旦被发现就会迅速被抹平——这就是为什么\"看起来无风险\"的机会，往往在你看到的时候已经消失。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"第四类，套利。核心是同一资产在不同市场、不同合约之间的价格偏差：不赌方向，只赚价差收敛。四种常见形态：ETF 折溢价、期现套利、跨期套利、可转债套利。它的特点是风险低、与大盘涨跌基本无关，但机会稀少、资金门槛高，而且随着参与者变多，价差窗口越来越短。"}}},{"id":"sc-16","stageId":"stg-quant-strategy-taxonomy","title":"日内与高频：硬件决定的战场","order":16,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-16-sp","type":"speech","text":"第五类，日内高频与短线。做市策略靠不断挂买卖单赚价差，单笔极薄、靠海量次数累积，需要券商极速通道和 C++ 底层，Python 基本只能做研究与监控。日内动量则利用盘中的分时结构、成交量异动做低买高卖。这里有一个对 A 股散户最关键的约束：T+1，当天买入不能当天卖出，所以日内策略在 A 股股票上基本不成立，主要适用于商品期货、港股和美股。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-16.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-16-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-16-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第六节 · 日内与高频\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-16-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">这一档的胜负手是延迟与通道，不是想法\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-16-c1","type":"text","left":56,"top":165,"width":430,"height":206,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#6d28d9;font-weight:700;text-align:left;margin-bottom:8px;\">高频做市（机构专用）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">不断挂买卖双边报价，赚取买卖价差\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">单次盈利极微薄，靠成交量累积\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">进入门槛：券商极速柜台、托管机房、C++/FPGA 底层、风控合规\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">Python 的定位：研究、监控、参数管理，\u003cstrong>不是下单路径\u003c/strong>\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f2eefd"},{"id":"sc-16-c2","type":"text","left":508,"top":165,"width":436,"height":206,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">日内动量短线\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">依据分时结构、成交量异动、盘口变化日内低买高卖\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">对执行速度、交易成本、情绪控制要求高\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">需要 T+0 制度环境与低费率通道\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">在 A 股股票上受 T+1 限制，主要适用于商品期货 / 港股 / 美股\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-16-note","type":"text","left":56,"top":383,"width":890,"height":65,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">\u003cstrong>给散户的结论：\u003c/strong>这一档不建议投入精力。同样的时间花在第一档策略的纪律化执行上，回报更确定。若确实想做日内，优先考虑国内商品期货（T+0、双向、无印花税），但必须先算清手续费与滑点占目标波动的比例。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"第五类，日内高频与短线。做市策略靠不断挂买卖单赚价差，单笔极薄、靠海量次数累积，需要券商极速通道和 C++ 底层，Python 基本只能做研究与监控。日内动量则利用盘中的分时结构、成交量异动做低买高卖。这里有一个对 A 股散户最关键的约束：T+1，当天买入不能当天卖出，所以日内策略在 A 股股票上基本不成立，主要适用于商品期货、港股和美股。"}}},{"id":"sc-17","stageId":"stg-quant-strategy-taxonomy","title":"事件驱动：信息落差里的钱","order":17,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-17-sp","type":"speech","text":"第六类，事件驱动。它的收益来自突发信息造成的价格偏离。四类常见事件：财报、股东行为类事件、宏观数据、政策。优点是逻辑独立于技术面，不需要猜行情；难点是消息传播极快，等你看到公告再进场，往往已经被定价，而且踩雷概率高。做事件驱动，关键是事先定义好事件口径与持有期，而不是事后解释。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-17.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-17-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-17-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第七节 · 事件驱动\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-17-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">靠信息与规则赚钱：逻辑独立，但时间窗口极短\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-17-c1","type":"text","left":56,"top":165,"width":208,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">① 财报事件\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">业绩超预期 / 不及预期\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">关键：同比、环比、以及相对一致预期的偏离\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">陷阱：预期差兑现过快，开盘即跳空\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-17-c2","type":"text","left":280,"top":165,"width":208,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">② 股东与资本行为\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">分红、定增、回购、解禁、大股东增减持\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">不同事件方向不同：回购偏正面，大额解禁偏负面\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">要看清\"规模 ÷ 流通盘\"与时间窗口\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-17-c3","type":"text","left":504,"top":165,"width":208,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">③ 宏观数据\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">CPI、PMI、利率、汇率发布\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">交易标的：股指期货、国债期货、相关行业\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">波动集中在发布瞬间，对执行速度要求高\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-17-c4","type":"text","left":728,"top":165,"width":216,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b3261e;font-weight:700;text-align:left;margin-bottom:8px;\">④ 政策事件\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">行业扶持 / 监管收紧落地\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">政策驱动常表现为连续多日的板块行情\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">风险：消息落地即出货，以及真假政策传闻\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdeceb"},{"id":"sc-17-note","type":"text","left":56,"top":400,"width":890,"height":65,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">实操纪律：\u003cstrong>先定义事件、再定义持有期与止损，最后才看历史收益\u003c/strong>。事件驱动策略最常见的失败方式是\"消息出来之后，为已经发生的行情找理由\"。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"第六类，事件驱动。它的收益来自突发信息造成的价格偏离。四类常见事件：财报、股东行为类事件、宏观数据、政策。优点是逻辑独立于技术面，不需要猜行情；难点是消息传播极快，等你看到公告再进场，往往已经被定价，而且踩雷概率高。做事件驱动，关键是事先定义好事件口径与持有期，而不是事后解释。"}}},{"id":"sc-18","stageId":"stg-quant-strategy-taxonomy","title":"机器学习量化：三种做法与各自的能力边界","order":18,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-18-sp","type":"speech","text":"第七类，机器学习与 AI 量化。三种主流做法：监督学习用于多因子打分，比如随机森林、XGBoost，本质是用非线性模型替代人工加权；时序深度学习用 LSTM、Transformer 直接预测收益率或波动率；强化学习让算法自己学仓位与择时。它们确实能发现人工不容易描述的模式，但金融时序信噪比极低，模型容量越大越容易记住噪声。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-18.mp3"},{"id":"sc-18-sp2","type":"spotlight","elementId":"sc-18-c3","description":"强调强化学习的奖励函数决定了它学到什么"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-18-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-18-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第八节 · 机器学习 / AI 量化\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-18-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">算法能挖到人工难写的规律，也更容易记住噪声\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-18-c1","type":"text","left":56,"top":165,"width":282,"height":250,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">① 监督学习\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">线性回归、随机森林、XGBoost 构建多因子打分模型\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">本质：用非线性模型替代\"人工加权\"\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">注意：特征时点、类别不平衡、模型稳定性\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">评价：比线性多因子更灵活，但也更难解释\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-18-c2","type":"text","left":358,"top":165,"width":282,"height":250,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">② 时序深度学习\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">LSTM / Transformer 预测收益率、波动率\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">需要长样本、截面与时间双重维度对齐\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">金融时序信噪比极低 → 模型容量越大越容易过拟合\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">实践中常退化为\"高成本的多因子模型\"\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-18-c3","type":"text","left":660,"top":165,"width":284,"height":250,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">③ 强化学习\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">AI 自主学习仓位管理与择时买卖\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">奖励函数设计（收益 / 回撤 / 换手）直接决定行为\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">模拟环境与真实市场差异 → 样本外表现常大幅衰减\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">风险：把\"环境偏差\"学成了\"策略\"\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f2eefd"}],"script":"第七类，机器学习与 AI 量化。三种主流做法：监督学习用于多因子打分，比如随机森林、XGBoost，本质是用非线性模型替代人工加权；时序深度学习用 LSTM、Transformer 直接预测收益率或波动率；强化学习让算法自己学仓位与择时。它们确实能发现人工不容易描述的模式，但金融时序信噪比极低，模型容量越大越容易记住噪声。"}}},{"id":"sc-19","stageId":"stg-quant-strategy-taxonomy","title":"机器学习量化的生死线：三道过拟合防线","order":19,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-19-sp","type":"speech","text":"不管用哪一种模型，机器学习量化真正的生死线都是同一件事：过拟合。三道防线缺一不可。第一，样本外和滚动前进验证——必须按时间切分，绝不随机切分，否则同一段行情同时出现在训练与测试里。第二，多重检验惩罚——你试过的组合越多，那个\"最优\"越可能只是运气，需要做真实的显著性检验。第三，经济逻辑校验——如果一个规律解释不了\"钱是从谁手里赚来的\"，它多半是数据错误或者结构性偶然。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-19.mp3"},{"id":"sc-19-sp2","type":"spotlight","elementId":"sc-19-c4","description":"三道防线是本节的核心结论"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-19-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-19-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第八节 · 风险控制\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-19-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">模型不是收益保证，验证流程才是\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-19-c4","type":"text","left":56,"top":165,"width":888,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b3261e;font-weight:700;text-align:left;margin-bottom:8px;\">三道过拟合防线（缺一不可）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">① 样本外 / 滚动前进验证：\u003c/span>按时间维度切分数据，绝不随机切分——随机切分会让同一段行情同时出现在训练集与测试集里，收益直接虚高；\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">② 多重检验惩罚：\u003c/span>每多试一组参数或特征，就多一次\"撞上运气\"的机会；试过 N 组之后，\"最优\"需要经过更严格的显著性检验才算数；\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">③ 经济逻辑校验：\u003c/span>能解释\"这笔钱从谁手里赚来\"的规律才值得继续；无法解释的高收益，多半是数据错误、幸存者偏差或结构性偶然。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdeceb"},{"id":"sc-19-note","type":"text","left":56,"top":400,"width":890,"height":65,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">\u003cstrong>结论：\u003c/strong>ML 量化是\u003cstrong>研究工具的升级\u003c/strong>，不是收益的保证。把数据口径、切分方式与验证流程做对，比把模型换成更复杂的结构更有价值。\u003cbr>给散户的现实建议：先用线性多因子把流程走通，等能稳定复现结果、并且理解每一步在做什么，再考虑引入机器学习。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"不管用哪一种模型，机器学习量化真正的生死线都是同一件事：过拟合。三道防线缺一不可。第一，样本外和滚动前进验证——必须按时间切分，绝不随机切分，否则同一段行情同时出现在训练与测试里。第二，多重检验惩罚——你试过的组合越多，那个\"最优\"越可能只是运气，需要做真实的显著性检验。第三，经济逻辑校验——如果一个规律解释不了\"钱是从谁手里赚来的\"，它多半是数据错误或者结构性偶然。"}}},{"id":"sc-20","stageId":"stg-quant-strategy-taxonomy","title":"波动率策略：交易波动率，而不是方向","order":20,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-20-sp","type":"speech","text":"第八类，波动率策略，属于期权专属。它交易的不是股价涨跌，而是波动率本身。跨式和勒式组合通过同时买入看涨和看跌期权，押注未来大幅波动；波动率套利则比较期权隐含波动率与标的实际历史波动率的偏差，做相对价值交易。这类策略在方向上接近中性，但对 Greeks、时间价值衰减和保证金管理的要求非常高，属于专业级战场。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-20.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-20-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-20-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第九节 · 波动率策略（期权）\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-20-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">标的涨跌不是主角，波动率才是\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-20-c1","type":"text","left":56,"top":165,"width":430,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">① 跨式 / 勒式组合\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">跨式：同时买入相同行权价的看涨 + 看跌（押注大幅波动）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">勒式：买不同行权价的看涨 + 看跌，成本更低、需要更大波动才盈利\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">风险：震荡不出方向时，时间价值持续衰减，期权逐日贬值\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-20-c2","type":"text","left":508,"top":165,"width":436,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">② 波动率套利\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">隐含波动率（IV）与已实现波动率（RV）存在偏差时做对冲交易\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">常见形态：IV 高于 RV → 卖波动率并 Delta 对冲\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">关键：Greeks 管理、Gamma 与 Theta 的权衡、保证金与尾部保护\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-20-note","type":"text","left":56,"top":400,"width":890,"height":61,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#6b7280;font-weight:400;text-align:left;margin-bottom:0px;\">\u003cstrong>门槛提示：\u003c/strong>国内场内期权（如 ETF 期权、股指期权）有投资者适当性要求与保证金制度，策略涉及多腿组合与动态对冲。本课只建立概念框架，不提供交易方案。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"第八类，波动率策略，属于期权专属。它交易的不是股价涨跌，而是波动率本身。跨式和勒式组合通过同时买入看涨和看跌期权，押注未来大幅波动；波动率套利则比较期权隐含波动率与标的实际历史波动率的偏差，做相对价值交易。这类策略在方向上接近中性，但对 Greeks、时间价值衰减和保证金管理的要求非常高，属于专业级战场。"}}},{"id":"sc-21","stageId":"stg-quant-strategy-taxonomy","title":"交互实验室二：配对交易 z 分实验台","order":21,"type":"interactive","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-21-sp","type":"speech","text":"第二个实验台，同样由助教林衡准备。它专门演示配对交易的两面。先在\"稳定协整\"下观察：价差偏离到 2σ 之后大概率回归，这是策略赚钱的地方。然后切到\"关系漂移\"，你会看到 z 分一直停在同一边——价差就是不肯回来。这就是配对交易用一次巨亏换掉很多次小赚的真实形态。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-21.mp3"},{"id":"sc-21-st","type":"widget_setState","state":{"regime":"stable","open":2,"close":0.5,"shock":1},"description":"载入默认实验参数"}],"content":{"type":"interactive","widgetType":"simulation","widgetConfig":{"type":"simulation","title":"配对交易价差回归实验台","variables":[{"name":"regime","label":"配对稳定性","control":"select","options":["stable","weak"]},{"name":"open","label":"开仓阈值(σ)","control":"slider","min":1,"max":3,"default":2},{"name":"close","label":"平仓阈值(σ)","control":"slider","min":0,"max":1.5,"default":0.5},{"name":"shock","label":"价差冲击强度","control":"slider","min":0.3,"max":2.5,"default":1}]},"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\u003ctitle>配对交易实验室 · 均值回归策略\u003c/title>\n\u003cstyle>\n  :root{\n    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --text:#1f2937; --muted:#6b7280;\n    --up:#d93a2b; --down:#12a05c; --accent:#2f6fdb;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;padding:12px;background:var(--bg);color:var(--text);\n    font:13px/1.5 -apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n  .head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}\n  .head h1{font-size:15px;margin:0;font-weight:650}\n  .head span{color:var(--muted);font-size:12px}\n  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}\n  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}\n  .ctl{display:flex;flex-direction:column;gap:3px;min-width:120px}\n  .ctl label{font-size:11px;color:var(--muted)}\n  input[type=range]{width:128px;accent-color:var(--accent)}\n  select{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--text);font-size:12px}\n  button{padding:5px 12px;border:1px solid var(--accent);background:#fff;color:var(--accent);\n    border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}\n  button:hover{background:#eef3fd}\n  canvas{width:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}\n  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}\n  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px}\n  .stat span{display:block;font-size:11px;color:var(--muted)}\n  .stat b{font-size:15px;font-variant-numeric:tabular-nums}\n  .pos{color:var(--up)} .neg{color:var(--down)}\n  .note{font-size:11px;color:var(--muted);margin-top:8px}\n  .legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:4px}\n  .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"head\">\n    \u003ch1>配对交易实验室\u003c/h1>\n    \u003cspan>价差 z 分偏离阈值时反向开仓，回归到平仓线时获利了结 · 合成协整序列，只演示机制\u003c/span>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"row\">\n      \u003cdiv class=\"ctl\">\n        \u003clabel>配对稳定性\u003c/label>\n        \u003cselect id=\"regime\">\n          \u003coption value=\"stable\" selected>稳定协整（经典配对场景）\u003c/option>\n          \u003coption value=\"weak\">关系漂移（协整被破坏，回归失效）\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\u003clabel>开仓阈值 \u003cb id=\"lbO\">2.0\u003c/b> σ\u003c/label>\u003cinput id=\"open\" type=\"range\" min=\"1\" max=\"3\" step=\"0.1\" value=\"2\">\u003c/div>\n      \u003cdiv class=\"ctl\">\u003clabel>平仓阈值 \u003cb id=\"lbC\">0.5\u003c/b> σ\u003c/label>\u003cinput id=\"close\" type=\"range\" min=\"0\" max=\"1.5\" step=\"0.1\" value=\"0.5\">\u003c/div>\n      \u003cdiv class=\"ctl\">\u003clabel>价差冲击 \u003cb id=\"lbS\">1.0\u003c/b>\u003c/label>\u003cinput id=\"shock\" type=\"range\" min=\"0.3\" max=\"2.5\" step=\"0.1\" value=\"1\">\u003c/div>\n      \u003cdiv class=\"ctl\">\u003clabel>&nbsp;\u003c/label>\u003cbutton id=\"regen\">重新生成价差\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003ccanvas id=\"legs\" height=\"180\">\u003c/canvas>\n  \u003ccanvas id=\"zscore\" height=\"170\">\u003c/canvas>\n  \u003ccanvas id=\"pnl\" height=\"140\">\u003c/canvas>\n\n  \u003cdiv class=\"legend\">\n    \u003cspan>\u003ci class=\"dot\" style=\"background:#d93a2b\">\u003c/i>价差为正偏离 → 做空价差\u003c/span>\n    \u003cspan>\u003ci class=\"dot\" style=\"background:#12a05c\">\u003c/i>价差为负偏离 → 做多价差\u003c/span>\n    \u003cspan>\u003ci class=\"dot\" style=\"background:#9aa3af\">\u003c/i>平仓 / 回归中枢\u003c/span>\n  \u003c/div>\n\n  \u003cdiv class=\"stats\" style=\"margin-top:10px\">\n    \u003cdiv class=\"stat\">\u003cspan>开仓次数\u003c/span>\u003cb id=\"sN\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>胜率\u003c/span>\u003cb id=\"sWin\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>价差组合收益\u003c/span>\u003cb id=\"sRet\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>最大回撤\u003c/span>\u003cb id=\"sDD\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>最长套牢天数\u003c/span>\u003cb id=\"sHold\">–\u003c/b>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"note\" id=\"verdict\">\u003c/div>\n\n\u003cscript>\n(function(){\n  const DAYS = 240;\n  let seed = 778899;\n  function rnd(){ seed = (seed + 0x6D2B79F5) >>> 0; let t = seed;\n    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }\n  function gauss(){ let u=0,v=0; while(u===0)u=rnd(); while(v===0)v=rnd();\n    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }\n\n  // y = alpha + beta*x + spread,  spread = OU(spread) + 冲击\n  function genSeries(regime, shockSize){\n    const x=[100], y=[], spread=[0];\n    for(let i=1;i\u003cDAYS;i++){\n      x.push(x[i-1] * Math.exp(0.0009 + gauss()*0.011));           // 共同因子：随机游走\n      let s = 0.82*spread[i-1] + gauss()*0.9*shockSize;            // 均值回复残差\n      if(regime === 'weak' && i > DAYS*0.55) s += 0.55;            // 关系漂移：残差中枢整体上移\n      spread.push(s);\n    }\n    for(let i=0;i\u003cDAYS;i++) y.push(2.0 + 1.1*x[i] + spread[i]);\n    // 以 z 分统计价差（滚动窗口）\n    const win = 40, z = new Array(DAYS).fill(null);\n    for(let i=win; i\u003cDAYS; i++){\n      const seg = spread.slice(i-win, i);\n      const m = seg.reduce((a,b)=>a+b,0)/win;\n      const sd = Math.sqrt(seg.reduce((a,b)=>a+(b-m)*(b-m),0)/win) || 1e-9;\n      z[i] = (spread[i]-m)/sd;\n    }\n    return {x, y, spread, z};\n  }\n  function backtest(S, openZ, closeZ){\n    let pos = 0, pnl = 0, holdStart = 0, longest = 0;\n    const equity = [0], marks = [], trades = [];\n    for(let i=1;i\u003cDAYS;i++){\n      const d = S.spread[i] - S.spread[i-1];\n      if(pos !== 0) pnl += pos * d;                                // 价差变动 → 组合盈亏\n      const zv = S.z[i];\n      if(zv !== null){\n        if(pos === 0 && zv >  openZ){ pos = -1; marks.push({i,kind:'short'}); holdStart = i; trades.push({open:i}); }\n        else if(pos === 0 && zv \u003c -openZ){ pos = 1; marks.push({i,kind:'long'}); holdStart = i; trades.push({open:i}); }\n        else if(pos !== 0 && Math.abs(zv) \u003c= closeZ){\n          marks.push({i,kind:'exit'});\n          pos = 0;\n        }\n        if(pos !== 0) longest = Math.max(longest, i - holdStart);\n      }\n      equity.push(pnl);\n    }\n    const closed = trades.filter(t=>t.close !== undefined);\n    let peak = 0, mdd = 0;\n    equity.forEach(v=>{ peak = Math.max(peak, v); mdd = Math.min(mdd, v-peak); });\n    return {equity, marks, trades, longest, pnl, mdd};\n  }\n  function tradesWithPnl(S, bt){\n    // 逐笔重算每笔盈亏（价差单位）\n    const openPos = [];\n    let cur = null; const out = [];\n    bt.marks.forEach(m=>{\n      if(m.kind === 'long'){ cur = {dir:1, open:m.i}; }\n      else if(m.kind === 'short'){ cur = {dir:-1, open:m.i}; }\n      else if(cur){ out.push({...cur, close:m.i, pnl: cur.dir*(S.spread[m.i]-S.spread[cur.open])}); cur = null; }\n    });\n    if(cur) out.push({...cur, close:DAYS-1, pnl: cur.dir*(S.spread[DAYS-1]-S.spread[cur.open]), openEnd:true});\n    return out;\n  }\n  function draw(cv, h){\n    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 700;\n    cv.width = w*dpr; cv.height = h*dpr;\n    const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx,w,h};\n  }\n  function grid(ctx, w, h, pad, lo, hi, dp){\n    ctx.strokeStyle='#e3e6ea'; ctx.lineWidth=1; ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle='#9aa3af';\n    for(let g=0; g\u003c=4; g++){\n      const y = pad.t + (h-pad.t-pad.b)*g/4;\n      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();\n      ctx.fillText((hi-(hi-lo)*g/4).toFixed(dp===undefined?1:dp), 4, y+3);\n    }\n  }\n  function series(ctx, arr, X, Y, color, wd, dash){\n    ctx.strokeStyle=color; ctx.lineWidth=wd||1.6; ctx.setLineDash(dash||[]); ctx.beginPath();\n    let started=false;\n    arr.forEach((v,i)=>{ if(v===null||v===undefined||!isFinite(v)) return;\n      started ? ctx.lineTo(X(i),Y(v)) : (ctx.moveTo(X(i),Y(v)), started=true); });\n    ctx.stroke(); ctx.setLineDash([]);\n  }\n\n  let S = null, BT = null;\n  function render(regenerate){\n    const regime = document.getElementById('regime').value;\n    const openZ = +document.getElementById('open').value;\n    const closeZ = Math.min(+document.getElementById('close').value, openZ-0.2);\n    const shock = +document.getElementById('shock').value;\n    document.getElementById('lbO').textContent = openZ.toFixed(1);\n    document.getElementById('lbC').textContent = closeZ.toFixed(1);\n    document.getElementById('lbS').textContent = shock.toFixed(1);\n    if(regenerate || !S || S.regime !== regime + shock){ S = genSeries(regime, shock); S.regime = regime + shock; }\n    BT = backtest(S, openZ, closeZ);\n    const trades = tradesWithPnl(S, BT);\n    const pad = {l:38, r:10, t:8, b:14};\n    const X = w => i => pad.l + (w-pad.l-pad.r)*i/(DAYS-1);\n\n    // ---- 图 1：两条腿归一化走势 ----\n    const A = draw(document.getElementById('legs'), 180);\n    const xa = X(A.w);\n    const nrm = a => { const b = a[0]; return a.map(v=>v/b); };\n    const nx = nrm(S.x), ny = nrm(S.y);\n    const vals = nx.concat(ny); let lo = Math.min(...vals), hi = Math.max(...vals);\n    const Y1 = v => pad.t + (A.h-pad.t-pad.b)*(hi-v)/(hi-lo);\n    grid(A.ctx, A.w, A.h, pad, lo, hi, 2);\n    series(A.ctx, nx, xa, Y1, '#2f6fdb'); series(A.ctx, ny, xa, Y1, '#d93a2b');\n    A.ctx.fillStyle='#6b7280'; A.ctx.font='11px -apple-system,sans-serif';\n    A.ctx.fillText('腿 A（蓝）与腿 B（红）归一化走势 —— 同涨同跌是配对的前提', pad.l+4, pad.t+12);\n\n    // ---- 图 2：z 分 ----\n    const B = draw(document.getElementById('zscore'), 170);\n    const xb = X(B.w);\n    let zlo = -3.4, zhi = 3.4;\n    const Y2 = v => pad.t + (B.h-pad.t-pad.b)*(zhi-v)/(zhi-zlo);\n    grid(B.ctx, B.w, B.h, pad, zlo, zhi, 1);\n    B.ctx.strokeStyle='#c9ced6'; B.ctx.setLineDash([3,3]);\n    [openZ, -openZ].forEach(v=>{ B.ctx.beginPath(); B.ctx.moveTo(pad.l, Y2(v)); B.ctx.lineTo(B.w-pad.r, Y2(v)); B.ctx.stroke(); });\n    B.ctx.strokeStyle='#9aa3af'; B.ctx.beginPath(); B.ctx.moveTo(pad.l, Y2(0)); B.ctx.lineTo(B.w-pad.r, Y2(0)); B.ctx.stroke();\n    B.ctx.setLineDash([]);\n    series(B.ctx, S.z, xb, Y2, '#2f6fdb', 1.6);\n    BT.marks.forEach(m=>{\n      const col = m.kind==='long' ? '#12a05c' : m.kind==='short' ? '#d93a2b' : '#9aa3af';\n      B.ctx.fillStyle = col; B.ctx.beginPath();\n      B.ctx.arc(xb(m.i), Y2(S.z[m.i]||0), 3.4, 0, 6.29); B.ctx.fill();\n    });\n    B.ctx.fillStyle='#6b7280'; B.ctx.font='11px -apple-system,sans-serif';\n    B.ctx.fillText('价差 z 分 + 开/平仓阈值（虚线）', pad.l+4, pad.t+12);\n\n    // ---- 图 3：累计盈亏 ----\n    const C = draw(document.getElementById('pnl'), 140);\n    const xc = X(C.w);\n    let plo = Math.min(0, ...BT.equity), phi = Math.max(0, ...BT.equity);\n    const sp = (phi-plo)*0.1 || 1; plo -= sp; phi += sp;\n    const Y3 = v => pad.t + (C.h-pad.t-pad.b)*(phi-v)/(phi-plo);\n    grid(C.ctx, C.w, C.h, pad, plo, phi, 1);\n    C.ctx.strokeStyle='#9aa3af'; C.ctx.beginPath(); C.ctx.moveTo(pad.l, Y3(0)); C.ctx.lineTo(C.w-pad.r, Y3(0)); C.ctx.stroke();\n    series(C.ctx, BT.equity, xc, Y3, '#d93a2b', 1.6);\n    C.ctx.fillStyle='#6b7280'; C.ctx.font='11px -apple-system,sans-serif';\n    C.ctx.fillText('价差组合累计盈亏（价差单位）', pad.l+4, pad.t+12);\n\n    // ---- 指标 ----\n    const winRate = trades.length ? trades.filter(t=>t.pnl>0).length/trades.length : 0;\n    const el = (id)=>(id);\n    const setC = (id, txt, val)=>{ const e=document.getElementById(id); e.textContent=txt;\n      if(val!==undefined) e.className = val>=0?'pos':'neg'; };\n    document.getElementById('sN').textContent = trades.length;\n    document.getElementById('sWin').textContent = trades.length ? (winRate*100).toFixed(0)+'%' : '—';\n    setC('sRet', BT.pnl.toFixed(1), BT.pnl);\n    setC('sDD', BT.mdd.toFixed(1), BT.mdd);\n    document.getElementById('sHold').textContent = BT.longest + ' 天';\n    document.getElementById('verdict').textContent = regime === 'weak'\n      ? '配对稳定性被破坏时：z 分持续在单侧累积，阈值迟迟等不到回归——配对交易最大的风险不是波动，而是\"价差不再回归\"（协整关系断裂）。'\n      : '稳定协整下：偏离越极端，回归概率越高，这正是均值回归策略的收益来源；但胜率高≠风险低，单次不回归足以吃掉多次小盈利。';\n  }\n  ['open','close','shock','regime'].forEach(id=>document.getElementById(id).addEventListener('input', ()=>render(id==='regime')));\n  document.getElementById('regime').addEventListener('change', ()=>render(true));\n  document.getElementById('regen').addEventListener('click', ()=>{ seed = (seed*7919+104729)>>>0; render(true); });\n  window.addEventListener('resize', ()=>render(false));\n  render(true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}},{"id":"sc-22","stageId":"stg-quant-strategy-taxonomy","title":"八类策略横向对比与人群匹配","order":22,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-22-sp","type":"speech","text":"把八类策略放在一张表上看，格局会很清楚。散户适合从趋势和均值回归入手：代码简单、逻辑透明，缺点分别是震荡市磨损和单边市套牢。机构的主流是多因子和事件驱动：长期稳定但需要数据、团队与成本控制。套利风险极低但机会稀少、门槛高。高频拼的是硬件，不适合散户。选择策略的本质，是选择与自己的资源匹配的战场。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-22.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-22-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-22-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第十节 · 横向对比\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-22-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">没有最好的策略，只有与你的资源匹配的策略\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-22-c1","type":"text","left":56,"top":165,"width":208,"height":264,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#1d4ed8;font-weight:700;text-align:left;margin-bottom:8px;\">新手散户\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">趋势跟踪\u003c/span>：代码最简单，大行情收益高；短板是震荡市连续止损\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">RSI 均值回归\u003c/span>：震荡市表现稳定；短板是单边趋势中深度套牢\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">建议：先只做一种，把纪律跑满 6 个月\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-22-c2","type":"text","left":280,"top":165,"width":208,"height":264,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#0f7a52;font-weight:700;text-align:left;margin-bottom:8px;\">有一定基础\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">多因子（简化版）\u003c/span>：长期稳定、可分散；短板是调仓成本与小盘流动性\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">策略组合\u003c/span>：趋势 + 均值回归并行，对冲不同市场环境\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">建议：先解决数据时点与交易成本\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-22-c3","type":"text","left":504,"top":165,"width":208,"height":264,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">机构 / 大资金\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">多因子选股\u003c/span>：容量大、可复制；短板是拥挤与容量衰减\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">事件驱动\u003c/span>：逻辑独立于技术面；短板是消息滞后与踩雷\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">建议：中性化 + 风控系统 + 归因分析\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-22-c4","type":"text","left":728,"top":165,"width":216,"height":264,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#6d28d9;font-weight:700;text-align:left;margin-bottom:8px;\">专业 / 顶级私募\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">套利\u003c/span>：风险极低、与大盘无关；短板是机会稀少、门槛高\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">高频\u003c/span>：收益稳定回撤小；短板是硬件通道成本极高，Python 不适用\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">波动率\u003c/span>：方向中性；短板是 Greeks 与保证金管理难度大\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f2eefd"},{"id":"sc-22-note","type":"text","left":56,"top":441,"width":890,"height":42,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">读表方法：先看\"短板\"那一列，问自己\u003cstrong>能不能承受这个短板带来的最坏情况\u003c/strong>。能承受，策略才有资格进入你的实盘。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"把八类策略放在一张表上看，格局会很清楚。散户适合从趋势和均值回归入手：代码简单、逻辑透明，缺点分别是震荡市磨损和单边市套牢。机构的主流是多因子和事件驱动：长期稳定但需要数据、团队与成本控制。套利风险极低但机会稀少、门槛高。高频拼的是硬件，不适合散户。选择策略的本质，是选择与自己的资源匹配的战场。"}}},{"id":"sc-23","stageId":"stg-quant-strategy-taxonomy","title":"补充实操建议：从代码到实盘的四个动作","order":23,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-23-sp","type":"speech","text":"最后是可执行的部分。第一，散户优先级：双均线趋势、RSI 均值回归、简单多因子打分，三选一先做扎实。第二，组合优化：趋势与均值回归搭配，让不同市场环境下的亏损互相抵消。第三，风控三件套——止损、仓位上限、最大回撤管控，这不是可选项，是策略能活下来的前提。第四，回测纪律：样本外验证、计入全部成本、明确策略失效条件。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-23.mp3"},{"id":"sc-23-sp2","type":"spotlight","elementId":"sc-23-c3","description":"强调风控要先于信号"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-23-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-23-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第十一节 · 落地\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-23-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">把地图变成动作：优先级、组合、风控、纪律\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-23-c1","type":"text","left":56,"top":165,"width":208,"height":272,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#1d4ed8;font-weight:700;text-align:left;margin-bottom:8px;\">① 散户优先实现\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">双均线趋势策略\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">RSI 均值回归策略\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">简单多因子打分选股\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">原则：一次只做一套，能解释每一笔盈亏\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-23-c2","type":"text","left":280,"top":165,"width":208,"height":272,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f7a52;font-weight:700;text-align:left;margin-bottom:8px;\">② 策略组合优化\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">趋势 + 均值回归并行运行\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">让不同市场环境下的亏损互相抵消\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">用相关性检查两个策略是否真的互补\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">目标不是收益最大化，而是回撤可控\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-23-c3","type":"text","left":504,"top":165,"width":208,"height":272,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b3261e;font-weight:700;text-align:left;margin-bottom:8px;\">③ 风控三件套\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">止损：单笔亏损上限（如账户 2%）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">仓位：单票/单品种上限、总仓位上限\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">最大回撤管控：触及阈值即降仓或停手\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">风控先于信号：先想亏多少，再想赚多少\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdeceb"},{"id":"sc-23-c4","type":"text","left":728,"top":165,"width":216,"height":272,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">④ 回测纪律\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">样本外验证 + 滚动前进\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">计入手续费、印花税、滑点、冲击成本\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">明确失效条件，而非无限优化\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">小资金实盘验证 3–6 个月再谈放大\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-23-note","type":"text","left":56,"top":449,"width":888,"height":65,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">顺序很重要：\u003cstrong>纪律 &gt; 风控 &gt; 策略 &gt; 参数\u003c/strong>。多数人失败在顺序倒过来——先沉迷调参数，最后才想起自己从没设过止损。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"最后是可执行的部分。第一，散户优先级：双均线趋势、RSI 均值回归、简单多因子打分，三选一先做扎实。第二，组合优化：趋势与均值回归搭配，让不同市场环境下的亏损互相抵消。第三，风控三件套——止损、仓位上限、最大回撤管控，这不是可选项，是策略能活下来的前提。第四，回测纪律：样本外验证、计入全部成本、明确策略失效条件。"}}},{"id":"sc-24","stageId":"stg-quant-strategy-taxonomy","title":"综合测验 · 策略选择与风险判断","order":24,"type":"quiz","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-24-sp","type":"speech","text":"最后一组题。第 5 题是开放设计题，没有唯一答案，但要求你把\"互补性\"和\"风控\"这两件事说清楚。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-24.mp3"}],"content":{"type":"quiz","questions":[{"id":"sc-24-q1","type":"single","points":2,"hasAnswer":true,"question":"一位散户资金 10 万元、只有手机看盘、每天可用 30 分钟。下面哪一组策略最匹配？","options":[{"label":"高频做市 + 期权波动率套利","value":"A"},{"label":"双均线趋势 + 简单多因子月度调仓","value":"B"},{"label":"股指期货期现套利","value":"C"},{"label":"日内动量 T+0 短线","value":"D"}],"answer":["B"],"analysis":"选择策略要先匹配资源：资金规模、时间投入、工具与执行能力。趋势策略与低频多因子对时间与硬件要求最低，最符合该条件。"},{"id":"sc-24-q2","type":"multiple","points":3,"hasAnswer":true,"question":"下列哪些做法能显著降低\"回测很漂亮、实盘很痛苦\"的概率？（多选）","options":[{"label":"样本外与滚动前进验证","value":"A"},{"label":"计入手续费与滑点等全部成本","value":"B"},{"label":"不断调整参数直到历史收益最高","value":"C"},{"label":"明确策略失效条件与最大回撤阈值","value":"D"}],"answer":["A","B","D"],"analysis":"C 恰恰是过拟合的典型来源：参数搜索次数越多，越可能挑到只属于历史的组合。"},{"id":"sc-24-q3","type":"single","points":2,"hasAnswer":true,"question":"关于\"套利策略风险极低\"，最准确的理解是？","options":[{"label":"套利是无风险的，可以满仓加杠杆","value":"A"},{"label":"风险低但并非无风险，且有资金门槛、容量与执行风险","value":"B"},{"label":"套利收益永远高于趋势策略","value":"C"},{"label":"只要有价差就一定存在套利机会","value":"D"}],"answer":["B"],"analysis":"价差可能继续扩大、第二条腿可能无法成交、资金成本与保证金占用都真实存在。\"低风险\"≠\"无风险\"，也不等于可以放大杠杆。"},{"id":"sc-24-q4","type":"single","points":2,"hasAnswer":true,"question":"A 股日内动量短线策略主要受哪一条制度约束限制？","options":[{"label":"T+1 交易制度","value":"A"},{"label":"缺少行情数据","value":"B"},{"label":"不能使用技术指标","value":"C"},{"label":"没有涨跌幅限制","value":"D"}],"answer":["A"],"analysis":"A 股股票实行 T+1，当日买入不能当日卖出，日内策略在股票上难以成立；商品期货与部分境外市场为 T+0。"},{"id":"sc-24-q5","type":"short_answer","points":6,"hasAnswer":true,"question":"请设计一个最小的策略组合：说明你选择哪两类策略、为什么它们互补、以及你设定哪两条风控规则。","answer":["趋势 + 均值回归","互补","止损","仓位上限","最大回撤"],"commentPrompt":"评分要点：(1) 选择趋势类与均值回归类各一种，并说明两策略在不同市场环境下表现相反（互补性）；(2) 至少给出两条具体风控规则，例如单笔止损比例、单品种仓位上限、最大回撤触发降仓；(3) 若能说明资金分配或相关性检查更佳。","analysis":"参考回答：趋势（双均线，适用于单边行情）+ 均值回归（RSI，适用于震荡行情）并行，因为二者亏损环境相反；风控规则一：单笔亏损达账户 2% 强制止损；风控规则二：组合最大回撤超过 15% 降半仓并暂停新开仓，待策略恢复样本外验证后再恢复。"}]}},{"id":"sc-25","stageId":"stg-quant-strategy-taxonomy","title":"实战项目：交付一份双均线策略回测与风控说明书","order":25,"type":"pbl","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-25-sp","type":"speech","text":"这是课程唯一的项目，也是最像真实工作的一步。你要交付的不是一张漂亮的曲线，而是一份别人能照着复现、并且诚实地写清了失效条件的说明书。评审只看四件事：假设清不清、实现对不对、风控全不全、结论诚不诚实。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-25.mp3"}],"content":{"type":"pbl","projectV2":{"uiPhase":"hero","title":"双均线趋势策略：回测与风控说明书","description":"用一套完整流程把\"看起来简单\"的双均线策略做实：明确假设 → 实现回测 → 加风控 → 写出一页纸结论。交付物是一份可复现的说明书，而不是一张漂亮的净值曲线。","learningObjective":"能够独立完成一个策略从假设、数据、回测、风控到结论交付的完整闭环，并诚实标注策略的失效条件。","gains":["掌握回测的最小可信流程：数据时点、交易成本、样本外验证","学会用最大回撤与盈亏比评估策略，而不是只看胜率","写出可被他人复现的策略说明书（含失效条件）"],"tags":["趋势跟踪","双均线","回测","风控","Python"],"language":"zh-CN","languageDirective":"全程使用简体中文；代码与指标名保留英文原样。","proficiency":"beginner","status":"active","roles":[{"id":"role-user","type":"user","name":"策略研究员（你）","description":"负责做出判断与交付，而不是让 AI 代做全部工作。"},{"id":"role-instructor","type":"instructor","name":"沈策 · 主讲","description":"负责目标裁决与最终评审，只在你明显跑偏时介入。","systemPrompt":"你是资深量化研究员，评审标准严格：数据时点、交易成本、样本外验证、失效条件四项缺一即不通过。给出具体、可执行的修改意见。"},{"id":"role-mentor","type":"mentor","name":"林衡 · 助教","description":"负责实现层面的答疑与排查。","systemPrompt":"你是数据与工程助教，擅长把策略规则翻译成可校验代码，并检查未来函数、幸存者偏差、成本口径等问题。"},{"id":"role-evaluator","type":"evaluator","name":"评审 Agent","description":"按统一评分表对交付物打分并给出改进项。","systemPrompt":"你按四个维度评分：假设清晰度、实现正确性、风控完备性、结论诚实度。每维度 0-5 分并给出理由。"}],"milestones":[{"id":"sc-25-m1","title":"里程碑一：把假设写在代码之前","status":"active","order":1,"briefing":"多数回测失败在这里：假设没写清，后面所有结论都无法检验。","completionCriteria":"产出一页\"策略假设卡\"：标的与周期、均线参数、入场/离场规则、手续费与滑点假设、样本区间与样本外区间。","microtasks":[{"id":"sc-25-t1-1","title":"明确交易假设，写成假设卡","description":"写出：标的与数据频率、短/长均线周期、金叉买入死叉清仓、手续费(bp)、滑点假设、T+1 约束、样本内/样本外区间划分。","status":"todo","assignee":"user","order":1,"hints":["假设卡要能被别人照着复现","样本外至少保留 30% 的数据不参与调参"],"completionCriteria":"假设卡覆盖全部 7 项要素，无缺项"},{"id":"sc-25-t1-2","title":"取数并做时点校验","description":"取日线行情数据，检查是否有缺失、复权处理是否正确，并说明数据来源与复权方式。","status":"todo","assignee":"user","order":2,"hints":["前复权/后复权会影响均线数值","确认数据不包含未来信息"],"completionCriteria":"能说明数据来源、复权方式与缺失处理方案"}],"debrief":"假设卡是整份交付物的地基：它决定了后面所有数字的可信范围。"},{"id":"sc-25-m2","title":"里程碑二：回测实现与绩效度量","status":"locked","order":2,"briefing":"把假设翻译成代码，并算出策略与基准的对比指标。","completionCriteria":"产出可运行的回测脚本 + 绩效表（累计收益、年化、最大回撤、胜率、盈亏比、换手率、持仓天数占比）。","microtasks":[{"id":"sc-25-t2-1","title":"实现信号与回测引擎","description":"实现均线计算、金叉死叉信号、按次收益统计；确保信号在收盘判定、次日生效，不存在未来函数。","status":"todo","assignee":"user","order":1,"hints":["信号日与成交日必须分离","把手续费按双边计提"],"completionCriteria":"脚本可运行且能打印每笔交易明细"},{"id":"sc-25-t2-2","title":"输出绩效对比表","description":"计算策略与买入持有的对比指标，并做出净值曲线与回撤曲线。","status":"todo","assignee":"user","order":2,"hints":["必须含最大回撤与盈亏比","同时给出交易次数与持仓天数占比"],"completionCriteria":"指标齐全，且能指出策略在哪个阶段跑输基准"},{"id":"sc-25-t2-3","title":"样本外验证","description":"在样本外区间重跑同一组参数，比较样本内外的差异并解释原因。","status":"todo","assignee":"user","order":3,"hints":["参数不得因样本外结果而调整","差异过大时，如实说明"],"completionCriteria":"给出样本内外对比，并诚实说明是否稳定"}]},{"id":"sc-25-m3","title":"里程碑三：风控、失效条件与一页纸结论","status":"locked","order":3,"briefing":"把\"能赚钱\"翻译成\"能活下来\"。","completionCriteria":"产出风控规则表（止损、仓位、最大回撤触发动作）+ 失效条件 + 一页纸结论，并通过评审。","microtasks":[{"id":"sc-25-t3-1","title":"设计风控规则","description":"给出三条可执行规则：单笔止损、单品种与总仓位上限、最大回撤触发后的降仓/停手动作，并说明参数依据。","status":"todo","assignee":"user","order":1,"hints":["风控要先于信号","参数要有依据，不能拍脑袋"],"completionCriteria":"三条规则均可被程序化执行"},{"id":"sc-25-t3-2","title":"写明策略失效条件","description":"列出认为该策略不再适用的可观测条件（如换手成本上升、连续 N 次假信号、波动结构变化）。","status":"todo","assignee":"user","order":2,"hints":["失效条件必须是可观测、可触发的"],"completionCriteria":"至少给出 3 条可观测的失效条件"},{"id":"sc-25-t3-3","title":"写出一页纸结论并提交评审","description":"用一页纸说明：策略赚的是什么钱、在什么环境下有效、最坏情况会怎样、是否值得小资金实盘验证。","status":"todo","assignee":"user","order":3,"hints":["结论要包含\"不确定的地方\"","避免使用\"稳定盈利\"等无法验证的表述"],"completionCriteria":"一页纸通过四项评分，且无未标注的不确定性"}],"debrief":"评审通过的标准不是收益高，而是结论诚实、可复现、失效条件明确。"}],"documents":[{"id":"sc-25-doc1","title":"策略假设卡模板.md","docType":"starter_file","content":"# 策略假设卡\n\n- 标的与数据频率：\n- 均线参数：短 = ___ 日，长 = ___ 日\n- 入场规则：\n- 离场规则：\n- 手续费（单边, bp）：\n- 滑点假设：\n- 交易制度约束（T+1 等）：\n- 样本内区间：\n- 样本外区间：\n"},{"id":"sc-25-doc2","title":"回测绩效指标说明.md","docType":"reference","content":"# 指标口径\n\n- 累计收益 = 期末净值 / 初始净值 - 1\n- 年化收益 = (期末净值)^(252/交易日数) - 1\n- 最大回撤 = min(净值 / 历史峰值 - 1)\n- 胜率 = 盈利交易数 / 总交易数（注意：单独看胜率没有意义）\n- 盈亏比 = 平均盈利 / 平均亏损\n- 持仓天数占比 = 有仓位天数 / 总交易日数\n- 换手率 = 期间成交额 / 平均持仓市值（衡量成本敏感度）\n"},{"id":"sc-25-doc3","title":"评审评分表.md","docType":"reference","content":"# 评审维度（各 0-5 分）\n\n1. 假设清晰度：假设卡是否可复现、样本外是否隔离\n2. 实现正确性：有无未来函数、成本是否计入\n3. 风控完备性：止损/仓位/回撤规则是否可执行\n4. 结论诚实度：是否标注不确定性与失效条件\n\n通过线：总分 ≥ 14 且第 4 项 ≥ 3。\n"}],"threads":[{"agentId":"ag-teacher","messages":[]},{"agentId":"ag-ta","messages":[]}],"submissions":[],"evaluations":[],"engagementEvents":[],"createdAt":"2026-09-21T16:00:00.000Z","updatedAt":"2026-09-21T16:00:00.000Z"},"projectConfig":{"legacyMirror":true,"note":"契约要求保留的兼容镜像，内容不被解释"}}},{"id":"sc-26","stageId":"stg-quant-strategy-taxonomy","title":"结课：三句话与下一步","order":26,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-26-sp","type":"speech","text":"课程到这里。请记住三句话：第一，先确定策略的底层假设，再谈参数；第二，风控先于信号，纪律先于收益；第三，回测的目标不是好看，而是排除已知偏差之后仍然成立。下一步建议：选一套策略，写出假设卡，跑一次诚实的回测，然后把你的结论发给我。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-26.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-26-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-26-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第十二节 · 收束\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-26-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">三句话记住这门课，以及你的下一步\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-26-c1","type":"text","left":56,"top":165,"width":282,"height":176,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#1d4ed8;font-weight:700;text-align:left;margin-bottom:8px;\">一 · 假设先行\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">每套策略都在赌某种市场假设：趋势延续、均值回归、或统计规律可复现。\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">先确认它赌的是什么，再看它赚没赚到钱。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-26-c2","type":"text","left":358,"top":165,"width":282,"height":176,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#b3261e;font-weight:700;text-align:left;margin-bottom:8px;\">二 · 风控先于信号\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">止损、仓位、最大回撤三条规则不是装饰，是策略能否长期存活的前提。\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">先算清最坏情况，再谈收益空间。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdeceb"},{"id":"sc-26-c3","type":"text","left":660,"top":165,"width":284,"height":176,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">三 · 回测是排除法\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">排除前视偏差、幸存者偏差、成本遗漏与参数过拟合之后，剩下的才有意义。\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">能诚实说出\"哪里不确定\"，比报一个高收益数字更有价值。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace
