  </div>`).join('');
document.getElementById('scenes').addEventListener('click', e => {
  const el = e.target.closest('.scene'); if(!el) return; go(+el.dataset.i);
});
document.getElementById('sceneCount').textContent = SCENES.length + ' 个';

adminInfo();
function adminInfo(){
  const c = SCENES.reduce((a,s)=>(a[s.type]=(a[s.type]||0)+1,a),{});
  const acts = SCENES.reduce((n,s)=>n+(s.actions?s.actions.length:0),0);
  const q = SCENES.filter(s=>s.type==='quiz').reduce((n,s)=>n+s.content.questions.length,0);
  document.getElementById('info').innerHTML = `
    <h3 style="margin:0 0 6px;font-size:14px">${esc(CLASSROOM.stage.name)}</h3>
    <p style="font-size:12.5px;color:#4b5563;margin:0 0 10px">${esc(CLASSROOM.stage.description)}</p>
    <div class="chips">
      <span class="chip">场景 ${SCENES.length}</span>
      <span class="chip">讲解 ${c.slide||0}</span>
      <span class="chip">测验 ${c.quiz||0}（${q} 题）</span>
      <span class="chip">交互 ${c.interactive||0}</span>
      <span class="chip">项目 ${c.pbl||0}</span>
    </div>
    <div class="contract" style="margin-top:10px">
      stage.id = ${esc(CLASSROOM.stage.id)}<br>
      dslVersion = ${esc(CLASSROOM.dslVersion)}<br>
      interactiveMode = ${String(!!CLASSROOM.stage.interactiveMode)}<br>
      播放动作总数 = ${acts}
    </div>
    <div style="margin-top:12px;font-size:12px;color:#6b7280;line-height:1.7">
      <b style="color:#101828">语言与配色</b><br>${esc(CLASSROOM.stage.languageDirective||'')}
    </div>
    <div style="margin-top:12px;font-size:12px;color:#6b7280;line-height:1.7">
      <b style="color:#101828">场景类型说明</b><br>
      slide：画布讲解 + 语音讲稿<br>
      quiz：单选/多选/简答，即时判分与解析<br>
      interactive：自包含 HTML 模拟器（iframe srcDoc）<br>
      pbl：项目制学习（里程碑 / 微任务 / 评审）
    </div>`;
}

/* ---------------- 渲染 ---------------- */
function fitCanvas(){
  const wrap = document.querySelector('.canvas-wrap'); const cv = document.getElementById('cv');
  if(!wrap || !cv) return;
  const scale = wrap.clientWidth / 1000;
  cv.style.transform = 'scale(' + scale + ')';
  wrap.style.height = (562.5 * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);

function renderSlide(sc, stageEl){
  const spotlighted = new Set((sc.actions||[]).filter(a=>a.type==='spotlight').map(a=>a.elementId));
  const els = sc.content.canvas.elements.map(el => {
    const style = [
      'left:' + el.left + 'px', 'top:' + el.top + 'px',
      'width:' + el.width + 'px', 'height:' + el.height + 'px',
      el.fill ? 'background:' + el.fill : '', 'border-radius:' + (el.fill ? '8px' : '0'),
      el.fill ? 'padding:10px 12px' : '',
      'color:' + (el.defaultColor||'#1f2937'),
      'font-family:' + (el.defaultFontName||'Microsoft YaHei'),
      'font-size:16px'
    ].filter(Boolean).join(';');
    return '<div class="el' + (spotlighted.has(el.id) ? ' spot' : '') + '" data-elid="' + esc(el.id) + '" style="' + style + '">' + el.content + '</div>';
  }).join('');
  stageEl.innerHTML = '<div class="canvas-wrap"><div class="canvas" id="cv">' + els + '</div></div>';
  requestAnimationFrame(fitCanvas);
}

function renderQuiz(sc, stageEl){
  const qs = sc.content.questions;
  stageEl.innerHTML = qs.map((q, qi) => {
    const id = sc.id + '-q' + qi;
    let body = '';
    if(q.type === 'short_answer'){
      body = '<textarea id="' + id + '" placeholder="先写下你的答案，再展开参考解析"></textarea>';
    } else {
      const inputType = q.type === 'multiple' ? 'checkbox' : 'radio';
      body = (q.options||[]).map(o => `
        <label class="opt" data-v="${esc(o.value)}" data-q="${id}">
          <input type="${inputType}" name="${id}" value="${esc(o.value)}">
          <span><b>${esc(o.value)}.</b> ${esc(o.label)}</span>
        </label>`).join('');
    }
    return `<div class="quiz-q" data-qid="${id}">
      <h4>${qi+1}. ${esc(q.question)} <span class="badge">${q.type==='single'?'单选':q.type==='multiple'?'多选':'简答'} · ${q.points||1} 分</span></h4>
      ${body}
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn" data-judge="${id}">提交判分</button>
        <button class="btn" data-reveal="${id}">查看解析</button>
      </div>
      <div class="ans" id="${id}-ans"></div>
    </div>`;
  }).join('');

  stageEl.onclick = (e) => {
    const jb = e.target.closest('[data-judge]');
    const rb = e.target.closest('[data-reveal]');
    if(jb || rb){
      const qid = (jb||rb).getAttribute(jb ? 'data-judge' : 'data-reveal');
      const qi = +qid.split('-q')[1]; const q = qs[qi];
      const ansBox = document.getElementById(qid + '-ans');
      let head = '';
      if(q.type === 'short_answer'){
        const txt = (document.getElementById(qid).value || '').trim();
        const hit = (q.answer||[]).filter(k => txt && txt.indexOf(k) >= 0);
        head = txt
          ? `<b>自评提示：</b>你的答案命中了 ${hit.length}/${(q.answer||[]).length} 个要点${hit.length ? '（' + hit.join('、') + '）' : ''}。<br>`
          : '<b>尚未作答</b>——建议先写下自己的想法，再看解析。<br>';
        ansBox.innerHTML = head + '<b>评分要点：</b>' + esc(q.commentPrompt||'') + '<br><b>参考解析：</b>' + esc(q.analysis||'') +
          '<br><b>参考答案关键词：</b>' + (q.answer||[]).map(esc).join('、');
        ansBox.classList.add('show');
        return;
      }
      const picked = Array.from(stageEl.querySelectorAll('input[name="' + qid + '"]:checked')).map(x => x.value);
      const correct = (q.answer||[]).slice().sort().join(',');
      const ok = picked.slice().sort().join(',') === correct;
      stageEl.querySelectorAll('[data-q="' + qid + '"]').forEach(l => {
        const v = l.dataset.v;
        l.classList.remove('right','wrong');
        if((q.answer||[]).includes(v)) l.classList.add('right');
        else if(picked.includes(v)) l.classList.add('wrong');
      });
      head = `<b>${ok ? '✅ 正确' : (picked.length ? '❌ 错误' : '⚠️ 未作答')}</b>　正确答案：${(q.answer||[]).join('、')}${picked.length ? '　你的选择：' + picked.join('、') : ''}<br>`;
      ansBox.innerHTML = head + '<b>解析：</b>' + esc(q.analysis||'');
      ansBox.classList.add('show');
    }
  };
}

function renderInteractive(sc, stageEl){
  const c = sc.content;
  stageEl.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:13px;font-weight:600">${esc((c.widgetConfig&&c.widgetConfig.title)||'交互模拟')}</div>
      <div class="chips" style="margin:0">
        <span class="chip">widgetType: ${esc(c.widgetType||'-')}</span>
        <span class="chip">自包含 HTML</span>
      </div>
    </div>
    <div class="iframe-wrap"><iframe id="widget" sandbox="allow-scripts" title="interactive-widget"></iframe></div>
    <p style="font-size:12.5px;color:#6b7280;margin:8px 0 0">
      说明：该交互内容以 <code>InteractiveContent.html</code> 形式内嵌，在 OpenMAIC 中通过 iframe <code>srcDoc</code> 渲染；上方的
      <code>widget_setState</code> / <code>widget_highlight</code> 动作即为播放引擎与模拟器之间的交互协议。本模拟使用合成数据，仅用于理解机制。
    </p>`;
  const f = document.getElementById('widget');
  f.setAttribute('srcdoc', c.html || '<p style="font-family:sans-serif;padding:16px">该场景仅提供 url 回退，未内嵌 html。</p>');
}

function renderPbl(sc, stageEl){
  const p = sc.content.projectV2;
  const roles = p.roles.map(r => `<span class="chip" title="${esc(r.description||'')}">${esc(r.name)}</span>`).join('');
  const ms = p.milestones.map(m => `
    <details class="ms" ${m.status === 'active' ? 'open' : ''}>
      <summary>${esc(m.title)} <span class="badge">${m.status === 'active' ? '进行中' : m.status === 'locked' ? '未解锁' : '已完成'}</span></summary>
      <div class="ms-bd">
        ${m.briefing ? '<p style="font-size:12.5px;color:#4b5563;margin:0 0 8px">' + esc(m.briefing) + '</p>' : ''}
        ${m.microtasks.map(t => `
          <div class="task">
            <label><input type="checkbox"><span><b>${esc(t.title)}</b><div style="color:#4b5563">${esc(t.description)}</div>
            <div class="meta">完成标准：${esc(t.completionCriteria||'—')}</div>
            ${(t.hints&&t.hints.length) ? '<div class="meta">提示：' + t.hints.map(esc).join(' / ') + '</div>' : ''}</span></label>
          </div>`).join('')}
        ${m.completionCriteria ? '<p style="font-size:12px;color:#0f7a52;margin:6px 0 0">里程碑验收：' + esc(m.completionCriteria) + '</p>' : ''}
      </div>
    </details>`).join('');
  const docs = (p.documents||[]).map(d => `
    <div class="doc" data-doc>
      <b style="font-size:12.5px">📄 ${esc(d.title)}</b> <span class="badge">${esc(d.docType)}</span>
      <pre>${esc(d.content)}</pre>
    </div>`).join('');
  stageEl.innerHTML = `
    <div class="pbl-hd">
      <div style="font-size:15px;font-weight:700">${esc(p.title)}</div>
      <p style="font-size:12.5px;color:#4b5563;margin:6px 0">${esc(p.description)}</p>
      ${p.learningObjective ? '<p style="font-size:12.5px;margin:0"><b>学习目标：</b>' + esc(p.learningObjective) + '</p>' : ''}
      <div class="chips">${roles}</div>
      <div class="chips">${(p.tags||[]).map(t => '<span class="chip" style="background:#f2f4f7;color:#4b5563;border-color:#e3e6ea">#' + esc(t) + '</span>').join('')}</div>
    </div>
    ${ms}
    <div style="margin-top:10px;font-size:12.5px;font-weight:600">项目文档（starter_file / reference）</div>
    ${docs}`;
  stageEl.querySelectorAll('[data-doc]').forEach(d => d.addEventListener('click', () => d.classList.toggle('open')));
}

/* ---------------------------------------------------------------- 语音讲解 */
const AGENT_BY_VOICE = {};
(CLASSROOM.stage.generatedAgentConfigs || []).forEach(a => {
  if (a.voiceConfig && a.voiceConfig.voiceId) AGENT_BY_VOICE[a.voiceConfig.voiceId] = a;
});
const NAR_MAP = {};
if (NARRATION && Array.isArray(NARRATION.entries)) {
  NARRATION.entries.forEach(e => { NAR_MAP[e.sceneId] = e; });
}

const audio = new Audio();
audio.preload = 'none';
const narBox = document.getElementById('narBox');
const narPlay = document.getElementById('narPlay');
const narSeek = document.getElementById('narSeek');
const narMeta = document.getElementById('narMeta');
const narState = document.getElementById('narState');
const narAuto = document.getElementById('narAuto');
let narReady = false;

function fmt(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

audio.addEventListener('loadedmetadata', () => {
  narReady = true;
  narPlay.disabled = false;
  narSeek.style.display = '';
  narMeta.textContent = fmt(audio.duration);
  if (narAuto.checked) playNar();
});
audio.addEventListener('timeupdate', () => {
  if (audio.duration) narSeek.value = (audio.currentTime / audio.duration) * 100;
  narMeta.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
});
audio.addEventListener('play',  () => { narPlay.textContent = '暂停'; narState.textContent = '播放中'; });
audio.addEventListener('pause', () => { narPlay.textContent = '播放'; narState.textContent = '已暂停'; });
audio.addEventListener('ended', () => {
  narPlay.textContent = '重播';
  narState.textContent = '播放完毕';
  narSeek.value = 0;
});
audio.addEventListener('error', () => {
  narBox.classList.add('miss');
  narPlay.disabled = true;
  narSeek.style.display = 'none';
  narState.innerHTML = '<span class="err">音频加载失败</span>';
  narMeta.textContent = '';
});
audio.addEventListener('waiting', () => { narState.textContent = '缓冲中…'; });

function playNar(){
  if (!narReady) return;
  const p = audio.play();
  if (p && p.catch) p.catch(() => { narState.textContent = '浏览器拦截了自动播放，请手动点击播放'; });
}

narPlay.addEventListener('click', () => {
  if (!narReady) return;
  if (audio.paused) playNar(); else audio.pause();
});
narSeek.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = (narSeek.value / 100) * audio.duration;
});

/* 切换场景时装载对应语音。file:// 下 <audio> 读本地相对路径可行，
   前提是 preview.html 与 audio/ 目录同级；缺失时整条播报栏降级。 */
function loadNarration(sc){
  audio.pause();
  narReady = false;
  narPlay.disabled = true;
  narSeek.style.display = 'none';
  narSeek.value = 0;
  narPlay.textContent = '播放';

  const entry = NAR_MAP[sc.id];
  if (!entry) {
    narBox.classList.add('miss');
    narState.textContent = '语音讲解：本场景未生成';
    narMeta.textContent = '运行 generate-narration.mjs 生成';
    audio.removeAttribute('src');
    return;
  }
  const agent = AGENT_BY_VOICE[entry.voice];
  narBox.classList.remove('miss');
  // 说话人与音色固定在左侧，右侧 meta 专用于时间轴，避免加载后被覆盖。
  narState.innerHTML = '语音讲解 · <span class="who">' + esc(agent ? agent.name : '未指定角色') +
    '</span> <span class="vs">' + esc(entry.voice) + (entry.size ? ' · ' + (entry.size / 1024).toFixed(0) + 'KB' : '') + '</span>';
  narMeta.textContent = '0:00 / 0:00';
  audio.src = 'audio/' + encodeURIComponent(entry.file);
  audio.load();
}

function go(i){
  cur = Math.max(0, Math.min(SCENES.length - 1, i));
  const sc = SCENES[cur];
  document.querySelectorAll('.scene').forEach(el => el.classList.toggle('on', +el.dataset.i === cur));
  const on = document.querySelector('.scene.on'); if(on) on.scrollIntoView({block:'nearest'});
  document.getElementById('kicker');
  const stageEl = document.getElementById('stage');
  stageEl.innerHTML = '';
  stageEl.innerHTML = `<div class="kicker"><span>场景 ${sc.order} / ${SCENES.length} · ${esc(sc.id)}</span>
    <span class="badge" style="color:${TYPE_COLOR[sc.type]};border-color:${TYPE_COLOR[sc.type]}33">${TYPE_LABEL[sc.type]} · type = ${sc.type}</span></div>
    <h2 class="title">${esc(sc.title)}</h2><div id="body"></div>`;
  const body = document.getElementById('body');
  if(sc.type === 'slide') renderSlide(sc, body);
  else if(sc.type === 'quiz') renderQuiz(sc, body);
  else if(sc.type === 'interactive') renderInteractive(sc, body);
  else if(sc.type === 'pbl') renderPbl(sc, body);

  const speeches = (sc.actions||[]).filter(a => a.type === 'speech');
  document.getElementById('scriptBox').innerHTML = speeches.length
    ? '<b style="font-size:11.5px;color:#6b7280">语音讲稿（speech action）</b><br>' + speeches.map(a => esc(a.text)).join('<br>')
    : '<span style="color:#9aa3af">本场景无 speech 动作</span>';
  loadNarration(sc);
  document.getElementById('actionBar').innerHTML = (sc.actions||[]).map(a =>
    `<span class="abar">${esc(a.type)}${a.elementId ? ' → ' + esc(a.elementId) : ''}${a.topic ? ' → ' + esc(a.topic) : ''}${a.target ? ' → ' + esc(a.target) : ''}</span>`).join('')
    + (sc.multiAgent && sc.multiAgent.enabled ? '<span class="abar" style="background:#f2eefd;color:#6d28d9;border-color:#ddd0f7">multiAgent: ' + sc.multiAgent.agentIds.length + ' 位角色</span>' : '');
  document.getElementById('pos').textContent = (cur + 1) + ' / ' + SCENES.length;
  document.getElementById('bar').style.width = ((cur + 1) / SCENES.length * 100) + '%';
  document.getElementById('contract').textContent =
    'OpenMAIC 契约：Stage(' + CLASSROOM.stage.id + ') → Scene{ id, stageId, title, order, type, content, actions }　|　类型集：slide / quiz / interactive / pbl';
}

document.getElementById('prev').addEventListener('click', () => go(cur - 1));
document.getElementById('next').addEventListener('click', () => go(cur + 1));
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowRight') go(cur + 1);
  if(e.key === 'ArrowLeft') go(cur - 1);
});
document.getElementById('stageName').textContent = CLASSROOM.stage.name;
document.getElementById('stageMode').textContent = 'interactiveMode: ' + (CLASSROOM.stage.interactiveMode ? 'on' : 'off');
go(0);
</script>
</body>
