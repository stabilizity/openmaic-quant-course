<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenMAIC 课堂预览 · 量化投资全分类策略</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --line:#e3e6ea; --text:#101828; --muted:#6b7280;
    --accent:#2f6fdb; --up:#d93a2b; --down:#12a05c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .app{display:grid;grid-template-columns:262px minmax(0,1fr) 300px;gap:12px;padding:12px;height:100vh}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .col-hd{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:650;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .col-bd{overflow:auto;padding:10px}
  .scroll-hide::-webkit-scrollbar{width:8px;height:8px}
  .scroll-hide::-webkit-scrollbar-thumb{background:#d5d9df;border-radius:4px}

  /* 角色 */
  .agent{display:flex;gap:8px;padding:7px 8px;border-radius:8px;margin-bottom:5px;background:#fafbfc;border:1px solid var(--line)}
  .avatar{width:28px;height:28px;border-radius:8px;flex:0 0 28px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .agent b{display:block;font-size:12.5px}
  .agent span{display:block;font-size:11px;color:var(--muted);line-height:1.35}

  /* 场景列表 */
  .scene{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:#374151}
  .scene:hover{background:#f2f4f7}
  .scene.on{background:#eef3fd;color:#1d4ed8;font-weight:600}
  .scene i{font-style:normal;font-size:10px;color:var(--muted);min-width:16px;text-align:right;padding-top:2px}
  .badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:#fff;margin-left:4px;vertical-align:1px}

  /* 主舞台 */
  .stage{padding:12px;overflow:auto}
  .kicker{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .title{font-size:17px;font-weight:700;margin:0 0 10px}
  .canvas-wrap{width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .canvas{width:1000px;height:562.5px;transform-origin:top left;position:relative;background:#fff}
  .el{position:absolute;overflow:visible;white-space:pre-wrap}
  .el.spot{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

  .quiz-q{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
  .quiz-q h4{margin:0 0 8px;font-size:14px}
  .opt{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
  .opt:hover{background:#f7f8fa}
  .opt.right{background:#eaf7f1;color:#0f7a52}
  .opt.wrong{background:#fdeceb;color:#b3261e}
  .ans{margin-top:8px;padding:8px 10px;background:#f7f8fa;border-left:3px solid var(--accent);border-radius:4px;font-size:12.5px;color:#374151;display:none}
  .ans.show{display:block}
  textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;font-size:13px;resize:vertical}
  .btn{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:#eef3fd}
  .btn.solid{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}

  .iframe-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  iframe{width:100%;height:760px;border:0;display:block;background:#fff}

  /* PBL */
  .pbl-hd{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef3fd;color:#1d4ed8;border:1px solid #d6e2fb}
  .ms{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
  .ms > summary{cursor:pointer;padding:9px 12px;background:#fafbfc;font-size:13px;font-weight:600;list-style:none}
  .ms > summary::-webkit-details-marker{display:none}
  .ms-bd{padding:10px 12px}
  .task{border-left:2px solid #d6e2fb;padding:4px 0 4px 10px;margin-bottom:8px;font-size:12.5px}
  .task b{font-size:12.5px}
  .task .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
  .task label{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
  .doc{border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin-top:6px;font-size:12px;background:#fff}
  .doc pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#374151;margin:6px 0 0;display:none}
  .doc.open pre{display:block}

  /* 底部讲稿 */
  .foot{padding:10px 12px;border-top:1px solid var(--line);background:#fafbfc}
  .script{font-size:12.5px;color:#374151;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
  /* 语音讲解播报条 */
  .nar{display:flex;align-items:center;gap:9px;font-size:12px;color:#374151;background:#fff;
       border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin-bottom:8px}
  .nar.miss{background:#fbfbfc;color:#9aa3af}
  .nar button{border:1px solid var(--line);background:#fff;color:#374151;border-radius:5px;
              padding:3px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
  .nar button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .nar button:disabled{opacity:.45;cursor:default}
  .nar .who{font-weight:600;color:#0b1220}
  .nar .vs{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .nar input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
  .nar .err{color:#b3261e;font-size:11px}
  .actions-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .abar{font-size:10.5px;padding:2px 7px;border-radius:4px;background:#f2f4f7;color:#4b5563;border:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:8px}
  .nav .grow{flex:1;height:6px;background:#e3e6ea;border-radius:99px;overflow:hidden}
  .nav .grow i{display:block;height:100%;background:var(--accent);width:0}
  .nav small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .contract{font-size:11px;color:var(--muted);margin-top:6px;word-break:break-all}
</style>
</head>
<body>
<div class="app">
  <!-- 左：角色 + 场景 -->
  <div class="col">
    <div class="col-hd"><span>课堂角色</span><span id="agentCount" style="color:var(--muted);font-weight:400">–</span></div>
    <div class="col-bd scroll-hide" id="agents" style="flex:0 0 auto;max-height:44%"></div>
    <div class="col-hd" style="border-top:1px solid var(--line)"><span>场景序列</span><span id="sceneCount" style="color:var(--muted);font-weight:400">–</span></div>
    <div class="col-bd scroll-hide" id="scenes" style="flex:1"></div>
  </div>

  <!-- 中：舞台 -->
  <div class="col">
    <div class="col-hd"><span id="stageName">–</span><span class="badge" id="stageMode">–</span></div>
    <div class="stage scroll-hide" id="stage" style="flex:1"></div>
    <div class="foot">
      <div class="nar miss" id="narBox">
        <span id="narState">语音讲解</span>
        <span class="vs" id="narMeta"></span>
        <input type="range" id="narSeek" min="0" max="100" value="0" step="0.1" style="display:none">
        <button id="narPlay" disabled>播放</button>
        <label style="font-size:11.5px;color:#6b7280;display:flex;align-items:center;gap:3px;cursor:pointer">
          <input type="checkbox" id="narAuto"> 切场景自动播放
        </label>
      </div>
      <div class="script" id="scriptBox">–</div>
      <div class="actions-bar" id="actionBar"></div>
      <div class="nav">
        <button class="btn" id="prev">上一场景</button>
        <button class="btn solid" id="next">下一场景</button>
        <div class="grow"><i id="bar"></i></div>
        <small id="pos">–</small>
      </div>
      <div class="contract" id="contract"></div>
    </div>
  </div>

  <!-- 右：课程信息 / 学习面板 -->
  <div class="col">
    <div class="col-hd"><span>课程概览</span></div>
    <div class="col-bd scroll-hide" id="info"></div>
  </div>
</div>

line","wb_clear","wb_delete"]},{"id":"ag-may","name":"阿May","role":"student","priority":5,"color":"#a855f7","avatar":"/avatars/note-taker.png","persona":"同学 · 私募多因子实习。问得最多的是中性化、调仓成本与容量；对\"因子为什么有效\"背后的经济解释感兴趣，习惯追问弱势一方承担了什么风险。","voiceConfig":{"providerId":"openai-tts","voiceId":"nova"},"voiceDesign":{"identity":"女声 / 二十五岁左右","texture":"干净、清晰","delivery":"专业、精确、偶尔锐利"},"allowedActions":["wb_open","wb_close","wb_draw_text","wb_draw_shape","wb_draw_chart","wb_draw_table","wb_draw_line","wb_clear","wb_delete"]},{"id":"ag-zhou","name":"老周","role":"student","priority":6,"color":"#f59e0b","avatar":"/avatars/thinker.png","persona":"同学 · 商品期货十年。趋势跟踪的信徒，也吃过均值回归的重亏。喜欢举自己爆过仓的例子，提醒别人别只看收益不看回撤。","voiceConfig":{"providerId":"openai-tts","voiceId":"fable"},"voiceDesign":{"identity":"男声 / 五十岁左右","texture":"沙哑、有磁性","delivery":"慢、讲故事、带情绪"},"allowedActions":["wb_open","wb_close","wb_draw_text","wb_draw_shape","wb_draw_line","wb_clear","wb_delete"]}]},"scenes":[{"id":"sc-01","stageId":"stg-quant-strategy-taxonomy","title":"课程封面与学习地图","order":1,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-01-sp","type":"speech","text":"欢迎来到这门课。我们不教\"哪只股票会涨\"，而是把量化策略这张地图铺开：从散户明天就能写出来的双均线，一路看到机构的多因子、专业机构的套利与高频。学完你应该能回答一个问题——面对任意一个策略，它赚的是哪一种钱，代价又是什么。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-01.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-01-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-01-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">MAIC 生成课堂 · 量化投资\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-01-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">量化投资全分类策略：从散户可做的简单策略到机构高阶策略\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-01-sub","type":"text","left":56,"top":165,"width":890,"height":48,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#6b7280;font-weight:400;text-align:left;margin-bottom:0px;\">三大类 · 八大策略族 · 26 个场景 · 含 2 个交互实验室与 1 个实战项目\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-01-c1","type":"text","left":56,"top":225,"width":208,"height":226,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">学完你能做到\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">说出八类策略各自赚的\"哪一种钱\"\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">判断一个策略适合什么市场环境\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">避开回测里最常见的三类陷阱\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-01-c2","type":"text","left":280,"top":225,"width":208,"height":226,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">课程结构\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">讲解：机制与规则\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">测验：即时判分与解析\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">实验：参数可调的模拟盘\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">项目：交付一份回测说明书\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-01-c3","type":"text","left":504,"top":225,"width":208,"height":226,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">不使用前提\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">本课不构成任何投资建议\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">示例数据为合成数据\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">收益数字仅用于理解机制\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-01-c4","type":"text","left":728,"top":225,"width":216,"height":226,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">一条主线\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">任何策略都建立在三种假设之上：趋势延续、均值回归、统计规律可复现。混淆它们，是亏钱的第一步。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-01-foot","type":"text","left":56,"top":463,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#6b7280;font-weight:400;text-align:left;margin-bottom:0px;\">配色约定：A 股习惯，\u003cspan style=\"color:#d93a2b;font-weight:700;\">红色代表上涨/买入信号\u003c/span>，\u003cspan style=\"color:#12a05c;font-weight:700;\">绿色代表下跌/卖出信号\u003c/span>。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"欢迎来到这门课。我们不教\"哪只股票会涨\"，而是把量化策略这张地图铺开：从散户明天就能写出来的双均线，一路看到机构的多因子、专业机构的套利与高频。学完你应该能回答一个问题——面对任意一个策略，它赚的是哪一种钱，代价又是什么。"}}},{"id":"sc-02","stageId":"stg-quant-strategy-taxonomy","title":"策略三档分类总览","order":2,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-02-sp","type":"speech","text":"先看全局。量化策略按门槛和复杂度分三档：第一档是散户一个人一台电脑就能跑完的简单策略；第二档是公募私募标准化生产的策略，需要数据、算力和团队；第三档是拼硬件、拼通道、拼研究深度的复杂策略。档位越高，收益来源越稳定，但门槛与容量约束也越硬。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-02.mp3"},{"id":"sc-02-sp2","type":"spotlight","elementId":"sc-02-c1","description":"指出散户可实现的策略起点"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-02-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-02-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第一节 · 全局地图\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-02-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">三档分类：门槛决定策略，也决定你的对手是谁\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-02-c1","type":"text","left":56,"top":165,"width":282,"height":283,"rotate":0,"content":"\u003cp style=\"font-size:17px;line-height:1.5;color:#1d4ed8;font-weight:700;text-align:left;margin-bottom:8px;\">第一档 · 散户可实现\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">双均线趋势\u003c/span>、\u003cspan style=\"font-weight:700;color:#0f172a;\">RSI 均值回归\u003c/span>、\u003cspan style=\"font-weight:700;color:#0f172a;\">简单多因子打分\u003c/span>\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">数据：免费行情 + 财报\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">算力：一台笔记本，分钟级回测\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">对手：同样是散户，以及量化资金的\"尾巴\"\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">特征：逻辑透明、能自己解释每一笔盈亏\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-02-c2","type":"text","left":358,"top":165,"width":282,"height":288,"rotate":0,"content":"\u003cp style=\"font-size:17px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">第二档 · 机构标准化\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">多因子选股\u003c/span>、\u003cspan style=\"font-weight:700;color:#0f172a;\">ETF / 期现套利\u003c/span>、\u003cspan style=\"font-weight:700;color:#0f172a;\">事件驱动\u003c/span>、\u003cspan style=\"font-weight:700;color:#0f172a;\">市场中性\u003c/span>\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">数据：Wind/聚源 + 另类数据\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">算力：集群 + 因子库 + 风控系统\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">对手：其它机构，比拼的是同一批因子的实现效率\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">特征：长期稳定、可大规模复制，但收益被资金量摊薄\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-02-c3","type":"text","left":660,"top":165,"width":284,"height":283,"rotate":0,"content":"\u003cp style=\"font-size:17px;line-height:1.5;color:#6d28d9;font-weight:700;text-align:left;margin-bottom:8px;\">第三档 · 高阶复杂\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">高频做市\u003c/span>、\u003cspan style=\"font-weight:700;color:#0f172a;\">期权波动率\u003c/span>、\u003cspan style=\"font-weight:700;color:#0f172a;\">强化学习择时\u003c/span>\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">数据：逐笔与委托队列\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">算力：托管机房 + 极速柜台 + C++/FPGA\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">对手：顶级自营与做市商\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">特征：单笔利润极薄、靠次数与延迟取胜；Python 只用于研究与监控\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f2eefd"},{"id":"sc-02-note","type":"text","left":56,"top":460,"width":890,"height":65,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">选档原则：\u003cstrong>门槛不是越高越好，而是要与自己的数据、资金、执行能力匹配\u003c/strong>。散户用第一档做扎实，收益往往好过用第三档的方法却只能勉强执行。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"先看全局。量化策略按门槛和复杂度分三档：第一档是散户一个人一台电脑就能跑完的简单策略；第二档是公募私募标准化生产的策略，需要数据、算力和团队；第三档是拼硬件、拼通道、拼研究深度的复杂策略。档位越高，收益来源越稳定，但门槛与容量约束也越硬。"}}},{"id":"sc-03","stageId":"stg-quant-strategy-taxonomy","title":"三种底层假设：策略为什么会互相打架","order":3,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"multiAgent":{"enabled":true,"agentIds":["ag-zhou","ag-may","ag-zhao","ag-ta"],"directorPrompt":"围绕\"三种假设如何解释各自的盈亏\"展开一轮讨论，要求每位角色用自己的经历举例，最后由助教给出统一框架。"},"actions":[{"id":"sc-03-sp","type":"speech","text":"为什么同一段行情，趋势策略赚钱、均值回归却亏钱？因为两者建立在相反的假设上。趋势假设价格有惯性，均值回归假设价格有中枢。第三个假设是统计规律：同样的条件重复出现，胜率就稳定。任何策略都是这三种假设中的一种或多种的组合，你要做的第一件事是明确自己站在哪一边。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-03.mp3"},{"id":"sc-03-disc","type":"discussion","topic":"趋势与均值回归在同一段行情里为什么会得出相反的结论？"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-03-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-03-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第一节 · 地基\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-03-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">任何策略都站在三种假设之一，混淆它们就是亏钱的开始\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-03-c1","type":"text","left":56,"top":165,"width":282,"height":209,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#1d4ed8;font-weight:700;text-align:left;margin-bottom:8px;\">假设一 · 趋势延续\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">价格有惯性，涨的会继续涨\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">成立环境：单边行情、政策驱动、产业周期\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">失效环境：震荡横盘 → 反复止损\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">代表：双均线、通道突破、MACD\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-03-c2","type":"text","left":358,"top":165,"width":282,"height":209,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#0f7a52;font-weight:700;text-align:left;margin-bottom:8px;\">假设二 · 均值回归\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">价格有中枢，偏离终将修复\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">成立环境：震荡市、有基本面锚的资产\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">失效环境：单边趋势 → 越跌越买、深度套牢\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">代表：RSI、布林带区间、配对交易\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-03-c3","type":"text","left":660,"top":165,"width":284,"height":209,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">假设三 · 统计规律可复现\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">同类条件重复出现时，胜率/赔率稳定\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">成立环境：样本足够、市场结构未变\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">失效环境：规则突变（涨跌停、T+1、监管）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">代表：多因子、事件驱动、机器学习\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-03-note","type":"text","left":56,"top":386,"width":890,"height":42,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">课堂讨论：老周做商品趋势，阿May 在私募做多因子，小赵拿手机追涨杀跌。三个人的亏损原因，会不会其实是\u003cstrong>同一个\u003c/strong>？\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"为什么同一段行情，趋势策略赚钱、均值回归却亏钱？因为两者建立在相反的假设上。趋势假设价格有惯性，均值回归假设价格有中枢。第三个假设是统计规律：同样的条件重复出现，胜率就稳定。任何策略都是这三种假设中的一种或多种的组合，你要做的第一件事是明确自己站在哪一边。"}}},{"id":"sc-04","stageId":"stg-quant-strategy-taxonomy","title":"趋势跟踪族：四种做法的共同结构","order":4,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-04-sp","type":"speech","text":"第一类，趋势跟踪。逻辑是顺势而为：价格走出明确方向时进场，方向破坏时离场。四种常见做法——双均线看两条均线的交叉，MACD 用快慢线差和零轴分层，布林带用通道边界做突破，通道突破则直接看 N 日新高新低，海龟交易法则是它的经典工程化版本。共同点是：胜率低、盈亏比高，靠少数几次大行情赚钱。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-04.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-04-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-04-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第二节 · 趋势跟踪\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-04-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">顺势而为：胜率低、盈亏比高，靠少数几波大行情赚钱\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-04-c1","type":"text","left":56,"top":165,"width":208,"height":272,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">① 双均线\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">金叉买入、死叉卖出\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">参数：MA5/MA20、MA10/MA60\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">优点：逻辑最透明，最容易复盘\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">短板：震荡市频繁假信号\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-04-c2","type":"text","left":280,"top":165,"width":208,"height":272,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">② MACD\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">快慢线金叉死叉 + 零轴区分多空大周期\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">零轴上方只做多、下方只做空\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">本质：均线差的动量表达\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">短板：同样滞后，不改变震荡市磨损\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-04-c3","type":"text","left":504,"top":165,"width":208,"height":272,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">③ 布林带通道\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">突破上轨做多、跌破下轨做空\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">仅在单边趋势中有效\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">在震荡市里价格反复触带 → 频繁止损\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">常与带宽（波动率）配合判断行情状态\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-04-c4","type":"text","left":728,"top":165,"width":216,"height":272,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">④ 通道突破 / 海龟\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">突破 N 日最高价开多，跌破 N 日最低价开空\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">配套：ATR 止损、金字塔加仓、按波动率定仓位\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">商品期货与股指期货的经典组合\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">核心贡献其实是\u003cstrong>风控模板\u003c/strong>，不只是信号\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-04-note","type":"text","left":56,"top":449,"width":890,"height":65,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">共同结构：\u003cstrong>入场信号（突破/交叉）+ 离场规则（反向信号或止损）+ 仓位规则（固定或按波动率）\u003c/strong>。三段缺一段，趋势策略就退化成\"追涨杀跌\"。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"第一类，趋势跟踪。逻辑是顺势而为：价格走出明确方向时进场，方向破坏时离场。四种常见做法——双均线看两条均线的交叉，MACD 用快慢线差和零轴分层，布林带用通道边界做突破，通道突破则直接看 N 日新高新低，海龟交易法则是它的经典工程化版本。共同点是：胜率低、盈亏比高，靠少数几次大行情赚钱。"}}},{"id":"sc-05","stageId":"stg-quant-strategy-taxonomy","title":"趋势策略的三笔代价：磨损、滞后、过拟合","order":5,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-05-sp","type":"speech","text":"趋势策略的钱不是白拿的，代价有三笔。第一笔是震荡磨损：行情没有方向时，均线反复交叉，每一次交叉都是手续费加滑点。第二笔是滞后成本：均线是历史价格的平滑，等你看到金叉，行情往往已经走了一段，顶部回吐部分利润。第三笔是参数敏感：5 日与 20 日、10 日与 60 日，回测结果差异可能很大，而事后调出来的最优参数，通常只属于过去。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-05.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-05-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-05-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第二节 · 代价\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-05-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">趋势不是免费的：磨损 + 滞后 + 参数过拟合\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-05-c1","type":"text","left":56,"top":165,"width":282,"height":226,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#b3261e;font-weight:700;text-align:left;margin-bottom:8px;\">代价一 · 震荡磨损\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">均线在横盘里反复交叉 → 高频小额亏损\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">手续费 + 滑点 + 印花税，把假信号的成本放大\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">典型表现：交易次数暴增而净值走平\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdeceb"},{"id":"sc-05-c2","type":"text","left":358,"top":165,"width":282,"height":226,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">代价二 · 滞后成本\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">信号来自历史价格的平滑 → 天然晚于行情\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">入场晚：错过启动段；出场晚：回吐主升段\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">缓解方向：缩短周期、改用突破而非交叉\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f2f4f7"},{"id":"sc-05-c3","type":"text","left":660,"top":165,"width":284,"height":226,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">代价三 · 参数过拟合\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">在一段历史上最优的参数，不代表未来最优\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">参数越多的策略，越容易\"记住\"历史噪声\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">纪律：参数要在样本外检验，且尽量少、尽量粗\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-05-note","type":"text","left":56,"top":403,"width":890,"height":42,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">下一步我们会进入交互实验室：把短均线、长均线、手续费都做成滑块，\u003cstrong>亲手看一眼趋势段和震荡段下同一个策略的天壤之别\u003c/strong>。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"趋势策略的钱不是白拿的，代价有三笔。第一笔是震荡磨损：行情没有方向时，均线反复交叉，每一次交叉都是手续费加滑点。第二笔是滞后成本：均线是历史价格的平滑，等你看到金叉，行情往往已经走了一段，顶部回吐部分利润。第三笔是参数敏感：5 日与 20 日、10 日与 60 日，回测结果差异可能很大，而事后调出来的最优参数，通常只属于过去。"}}},{"id":"sc-06","stageId":"stg-quant-strategy-taxonomy","title":"测验 · 趋势跟踪","order":6,"type":"quiz","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-06-sp","type":"speech","text":"五道题，先自己判断，再看解析。重点是第 5 题，它会检验你是否真的理解了趋势策略的收益结构。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-06.mp3"}],"content":{"type":"quiz","questions":[{"id":"sc-06-q1","type":"single","points":2,"hasAnswer":true,"question":"双均线策略在下面哪种行情里最容易持续亏损？","options":[{"label":"单边上涨的产业周期行情","value":"A"},{"label":"宽度收敛的震荡横盘行情","value":"B"},{"label":"放量突破的启动行情","value":"C"},{"label":"趋势中途的第一次回踩","value":"D"}],"answer":["B"],"analysis":"震荡行情中价格反复穿越均线，金叉死叉交替出现，每次交叉都付出成本却不产生盈利空间——这就是\"磨损区\"。"},{"id":"sc-06-q2","type":"multiple","points":3,"hasAnswer":true,"question":"一套完整可执行的趋势策略，至少需要包含哪些组成部分？（多选）","options":[{"label":"入场信号规则","value":"A"},{"label":"离场 / 止损规则","value":"B"},{"label":"仓位规模规则","value":"C"},{"label":"对未来三个月行情的预测","value":"D"}],"answer":["A","B","C"],"analysis":"趋势策略 = 信号 + 离场 + 仓位。少了离场与仓位，信号就成了裸奔；趋势跟踪恰恰不依赖对具体点位的预测。"},{"id":"sc-06-q3","type":"single","points":2,"hasAnswer":true,"question":"海龟交易法则里，ATR 最主要的用途是？","options":[{"label":"预测明天的涨跌方向","value":"A"},{"label":"度量波动率并据此决定仓位与止损距离","value":"B"},{"label":"筛选基本面良好的品种","value":"C"},{"label":"计算主力资金的流入流出","value":"D"}],"answer":["B"],"analysis":"ATR 是平均真实波幅，衡量\"这个品种一天大概动多少\"。波动大的品种仓位小、止损距离宽，从而让不同品种的风险预算相等。"},{"id":"sc-06-q4","type":"single","points":2,"hasAnswer":true,"question":"回测中把短均线/长均线参数调到某组\"历史收益最高\"的组合，最大的问题是？","options":[{"label":"计算量太大","value":"A"},{"label":"参数拟合了历史噪声，样本外大概率失效","value":"B"},{"label":"手续费会变高","value":"C"},{"label":"均线参数必须服从官方推荐值","value":"D"}],"answer":["B"],"analysis":"参数越多、搜索次数越多，越容易挑到偶然有效的组合。纪律是：参数尽量少而粗，并在样本外与不同市场上复验。"},{"id":"sc-06-q5","type":"short_answer","points":5,"hasAnswer":true,"question":"用一句话说明：为什么趋势策略\"胜率低但仍能赚钱\"？","answer":["盈亏比","大行情","少数交易贡献主要利润","小亏多次、大赚几次"],"commentPrompt":"评分要点：(1) 承认胜率低（大量小亏）；(2) 指出少数趋势行情带来大额盈利，盈亏比高；(3) 累计结果依赖正期望。提到\"截断亏损、让利润奔跑\"或\"盈利集中度\"可加分。","analysis":"趋势策略的期望值来自\"小亏多次 + 大赚几次\"。因此评估它不能只看胜率，要同时看盈亏比、最大回撤与盈利集中度；也要接受\"连续小亏十几次\"是正常状态。"}]}},{"id":"sc-07","stageId":"stg-quant-strategy-taxonomy","title":"均值回归族：RSI、均线回归与配对交易","order":7,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-07-sp","type":"speech","text":"第二类，均值回归。逻辑与趋势相反：物极必反，价格偏离中枢之后会回归。三种常见做法：RSI 超买超卖做反向；价格大幅偏离均线时反向开仓、等回到均线；配对交易则利用两只高度相关标的的价差回归。它在震荡市里舒服，在单边行情里会深度套牢，去年赚钱的策略今年可能是灾难。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-07.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-07-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-07-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第三节 · 均值回归\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-07-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">物极必反：震荡市的利器，单边市的陷阱\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-07-c1","type":"text","left":56,"top":165,"width":282,"height":231,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#0f7a52;font-weight:700;text-align:left;margin-bottom:8px;\">① RSI 超买超卖\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">RSI &gt; 70 视为超买 → 卖出/做空\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">RSI &lt; 30 视为超卖 → 买入\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">适合震荡横盘的个股与指数\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">单边牛市中会持续踏空或反复被打脸\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-07-c2","type":"text","left":358,"top":165,"width":282,"height":231,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#0f7a52;font-weight:700;text-align:left;margin-bottom:8px;\">② 均线回归\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">价格大幅偏离 20 / 60 日均线时反向开仓\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">等待价格回到均线附近了结\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">本质：把均线当作\"锚\"，而非趋势信号\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">需要设定偏离阈值（如 2 倍标准差）\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-07-c3","type":"text","left":660,"top":165,"width":284,"height":231,"rotate":0,"content":"\u003cp style=\"font-size:16px;line-height:1.5;color:#1d4ed8;font-weight:700;text-align:left;margin-bottom:8px;\">③ 配对交易（经典）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">找两只高相关标的（同行业、上下游、ETF 与其成分股）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">价差拉大 → 做空高估 + 做多低估\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">等价差收敛后平仓获利\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">最大风险不是波动，而是\u003cstrong>关系断裂\u003c/strong>\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-07-note","type":"text","left":56,"top":408,"width":890,"height":65,"rotate":0,"content":"\u003cp style=\"font-size:14px;line-height:1.5;color:#374151;font-weight:400;text-align:left;margin-bottom:0px;\">与趋势策略的关系：\u003cstrong>两者是互补的，不是对立的\u003c/strong>。趋势策略在震荡市磨损，均值回归在单边市套牢；同一条主线里放两类策略，本身就是最朴素的风险分散。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"第二类，均值回归。逻辑与趋势相反：物极必反，价格偏离中枢之后会回归。三种常见做法：RSI 超买超卖做反向；价格大幅偏离均线时反向开仓、等回到均线；配对交易则利用两只高度相关标的的价差回归。它在震荡市里舒服，在单边行情里会深度套牢，去年赚钱的策略今年可能是灾难。"}}},{"id":"sc-08","stageId":"stg-quant-strategy-taxonomy","title":"配对交易：协整、z 分与关系断裂风险","order":8,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-08-sp","type":"speech","text":"配对交易值得单独讲，因为它把均值回归的思想表达得最干净，也最容易讲清楚\"风险到底在哪\"。第一步是找到协整的两条腿——注意是协整，不只是相关，相关说的是同涨同跌，协整说的是价差长期稳定。第二步用 z 分刻画价差偏离程度。第三步偏离超过阈值就反向开仓，回归到平仓线了结。真正的风险是价差不再回归，也就是基本面关系变了。A 股还要多一层约束：融券券源少、成本高，做空不容易，所以常用 ETF 或股指期货来替代其中一条腿。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-08.mp3"},{"id":"sc-08-sp2","type":"spotlight","elementId":"sc-08-c4","description":"强调关系断裂是配对交易的主要亏损来源"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-08-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-08-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第三节 · 深挖配对交易\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-08-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">价差是主角：不赌方向，赌两条腿的关系\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-08-c1","type":"text","left":56,"top":165,"width":430,"height":157,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">第 1 步 · 找两条腿\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">相关性只说明同向波动，\u003cstrong>协整\u003c/strong>才说明价差长期稳定\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">候选：同业、上下游、ETF 与其重仓成分\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">检验：用价差做平稳性检验，别只看相关系数\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-08-c2","type":"text","left":508,"top":165,"width":436,"height":157,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">第 2 步 · 量化偏离：z 分\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">z = (当前价差 − 滚动均值) ÷ 滚动标准差\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">z 分把\"偏离多少\"变成可比数值\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">阈值越大 → 信号越可靠但机会越少；反之噪声更多\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-08-c3","type":"text","left":56,"top":334,"width":430,"height":157,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">第 3 步 · 开仓与了结\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">z &gt; +阈值：做空价差（空高估腿 + 多低估腿）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">z &lt; −阈值：做多价差（多低估腿 + 空高估腿）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">|z| 回到平仓线了结，并设最大持仓天数\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-08-c4","type":"text","left":508,"top":334,"width":436,"height":157,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b3261e;font-weight:700;text-align:left;margin-bottom:8px;\">风险与 A 股现实约束\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">真正亏大钱：价差中枢整体位移（并购、暴雷、行业变化）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">融券券源少、费率与期限受限 → 散户做空受限\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">替代：ETF 替换单腿，或用股指期货对冲\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdeceb"},{"id":"sc-08-warn","type":"text","left":56,"top":503,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#6b7280;font-weight:400;text-align:left;margin-bottom:0px;\">\u003cstrong>边界：\u003c/strong>以上是机制讲解，不是标的推荐；做空成本、券源与容量才是实盘门槛。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4}],"script":"配对交易值得单独讲，因为它把均值回归的思想表达得最干净，也最容易讲清楚\"风险到底在哪\"。第一步是找到协整的两条腿——注意是协整，不只是相关，相关说的是同涨同跌，协整说的是价差长期稳定。第二步用 z 分刻画价差偏离程度。第三步偏离超过阈值就反向开仓，回归到平仓线了结。真正的风险是价差不再回归，也就是基本面关系变了。A 股还要多一层约束：融券券源少、成本高，做空不容易，所以常用 ETF 或股指期货来替代其中一条腿。"}}},{"id":"sc-09","stageId":"stg-quant-strategy-taxonomy","title":"测验 · 均值回归与配对交易","order":9,"type":"quiz","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-09-sp","type":"speech","text":"这一组题的重点是第 4 题：胜率不是收益。很多散户被\"八成胜率\"吸引，最后死在剩下那两成里。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-09.mp3"}],"content":{"type":"quiz","questions":[{"id":"sc-09-q1","type":"single","points":2,"hasAnswer":true,"question":"配对交易中，\"相关\"与\"协整\"的区别是什么？","options":[{"label":"两者是同一件事的两种说法","value":"A"},{"label":"相关描述同向波动，协整描述价差长期稳定","value":"B"},{"label":"相关只适用于期货","value":"C"},{"label":"协整只看成交量","value":"D"}],"answer":["B"],"analysis":"两只股票可能长期同涨同跌（高相关），但价差中枢持续漂移——这样配对交易依然会亏。配对交易真正需要的是价差的均值回复性，即协整关系。"},{"id":"sc-09-q2","type":"single","points":2,"hasAnswer":true,"question":"滚动 z 分为 +2.8σ，高于你设定的开仓阈值 2.0σ，按规则应当？","options":[{"label":"做多价差","value":"A"},{"label":"做空价差","value":"B"},{"label":"继续观望","value":"C"},{"label":"立即满仓单边做多高估腿","value":"D"}],"answer":["B"],"analysis":"z 为正表示价差高于滚动均值，赌它回归就要在价差上做空：卖高估腿、买低估腿。方向搞反是初学者最常见的错误。"},{"id":"sc-09-q3","type":"multiple","points":3,"hasAnswer":true,"question":"配对交易发生大额亏损，通常来自哪些原因？（多选）","options":[{"label":"价差中枢发生整体位移（关系断裂）","value":"A"},{"label":"做空腿的融券成本与券源限制","value":"B"},{"label":"不加最大持仓时限，长期套牢","value":"C"},{"label":"z 分阈值设置过小","value":"D"}],"answer":["A","B","C"],"analysis":"前三条是主要亏损来源。阈值过小本身是\"更频繁交易\"的取舍，会放大成本但不必然是亏损主因——真正的杀手是价差不再回归。"},{"id":"sc-09-q4","type":"short_answer","points":5,"hasAnswer":true,"question":"为什么说\"高胜率\"对均值回归策略来说是一种危险的安慰？","answer":["单次大亏","盈亏比低","尾部风险","小赚多次一次亏光"],"commentPrompt":"评分要点：(1) 均值回归通常小赚多次、胜率高；(2) 但单次不回归的亏损可能远超多次盈利之和；(3) 因此必须看盈亏比、最大回撤与尾部风险管理，而非只看胜率。","analysis":"胜率是\"频率\"，收益是\"频率 × 幅度\"。均值回归天然是高胜率低盈亏比结构，把注意力放在胜率上，会系统性低估尾部风险。"}]}},{"id":"sc-10","stageId":"stg-quant-strategy-taxonomy","title":"交互实验室一：双均线参数实验台","order":10,"type":"interactive","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-10-sp","type":"speech","text":"现在你来动手。这个实验台里放的是助教林衡准备好的参数，你来调。先把行情模式切到\"单边趋势\"，看金叉死叉能不能吃到主升段；再切到\"震荡横盘\"，看同一个策略如何被手续费一点点磨死。然后试着把长均线从 20 拉到 60，观察交易次数和回撤怎么变。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-10.mp3"},{"id":"sc-10-st","type":"widget_setState","state":{"mode":"mixed","fast":5,"slow":20,"fee":5},"description":"载入默认实验参数"},{"id":"sc-10-hl","type":"widget_highlight","target":"#mode","description":"提示先切换行情模式"}],"content":{"type":"interactive","widgetType":"simulation","widgetConfig":{"type":"simulation","title":"双均线趋势策略实验台","variables":[{"name":"mode","label":"行情模式","control":"select","options":["trend","range","mixed"]},{"name":"fast","label":"短均线周期","control":"slider","min":3,"max":20,"default":5},{"name":"slow","label":"长均线周期","control":"slider","min":10,"max":90,"default":20},{"name":"fee","label":"单边手续费(bp)","control":"slider","min":0,"max":30,"default":5}]},"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\u003ctitle>双均线实验室 · 趋势跟踪策略\u003c/title>\n\u003cstyle>\n  :root{\n    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --text:#1f2937; --muted:#6b7280;\n    --up:#d93a2b; --down:#12a05c; --ma5:#d93a2b; --ma20:#2f6fdb; --accent:#2f6fdb;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;padding:12px;background:var(--bg);color:var(--text);\n    font:13px/1.5 -apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n  .head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}\n  .head h1{font-size:15px;margin:0;font-weight:650}\n  .head span{color:var(--muted);font-size:12px}\n  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}\n  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}\n  .ctl{display:flex;flex-direction:column;gap:3px;min-width:128px}\n  .ctl label{font-size:11px;color:var(--muted)}\n  .ctl b{font-weight:600;color:var(--text)}\n  input[type=range]{width:132px;accent-color:var(--accent)}\n  select{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--text);font-size:12px}\n  button{padding:5px 12px;border:1px solid var(--accent);background:#fff;color:var(--accent);\n    border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}\n  button:hover{background:#eef3fd}\n  canvas{width:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:6px}\n  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:8px}\n  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px}\n  .stat span{display:block;font-size:11px;color:var(--muted)}\n  .stat b{font-size:15px;font-variant-numeric:tabular-nums}\n  .pos{color:var(--up)} .neg{color:var(--down)}\n  .note{font-size:11px;color:var(--muted);margin-top:6px}\n  .legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin:6px 0 0}\n  .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"head\">\n    \u003ch1>双均线实验室\u003c/h1>\n    \u003cspan>短均线上穿长均线（金叉）做多，下穿（死叉）清仓 · 当日收盘判定信号、以该收盘价成交，手续费双边计提（无未来函数）\u003c/span>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"row\">\n      \u003cdiv class=\"ctl\">\n        \u003clabel>行情模式\u003c/label>\n        \u003cselect id=\"mode\">\n          \u003coption value=\"trend\">单边趋势（趋势策略的主场）\u003c/option>\n          \u003coption value=\"range\">震荡横盘（趋势策略的坟场）\u003c/option>\n          \u003coption value=\"mixed\" selected>先趋势后震荡（真实市场）\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\u003clabel>短均线 \u003cb id=\"lbF\">5\u003c/b> 日\u003c/label>\u003cinput id=\"fast\" type=\"range\" min=\"3\" max=\"20\" step=\"1\" value=\"5\">\u003c/div>\n      \u003cdiv class=\"ctl\">\u003clabel>长均线 \u003cb id=\"lbS\">20\u003c/b> 日\u003c/label>\u003cinput id=\"slow\" type=\"range\" min=\"10\" max=\"90\" step=\"1\" value=\"20\">\u003c/div>\n      \u003cdiv class=\"ctl\">\u003clabel>单边手续费 \u003cb id=\"lbFee\">5\u003c/b> bp\u003c/label>\u003cinput id=\"fee\" type=\"range\" min=\"0\" max=\"30\" step=\"1\" value=\"5\">\u003c/div>\n      \u003cdiv class=\"ctl\">\u003clabel>&nbsp;\u003c/label>\u003cbutton id=\"regen\">重新生成行情（同参数换样本）\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"legend\">\n      \u003cspan>\u003ci class=\"dot\" style=\"background:#d93a2b\">\u003c/i>金叉买入\u003c/span>\n      \u003cspan>\u003ci class=\"dot\" style=\"background:#12a05c\">\u003c/i>死叉卖出\u003c/span>\n      \u003cspan>\u003ci class=\"dot\" style=\"background:#2f6fdb\">\u003c/i>长均线\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003ccanvas id=\"price\" height=\"230\">\u003c/canvas>\n  \u003cdiv class=\"legend\" style=\"margin:6px 0 10px\">\n    \u003cspan>上：价格与双均线\u003c/span>\u003cspan>下：策略资金曲线 vs 买入持有（初始 = 1.00）\u003c/span>\n  \u003c/div>\n  \u003ccanvas id=\"equity\" height=\"150\">\u003c/canvas>\n\n  \u003cdiv class=\"stats\">\n    \u003cdiv class=\"stat\">\u003cspan>交易次数\u003c/span>\u003cb id=\"sTrades\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>胜率\u003c/span>\u003cb id=\"sWin\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>策略累计收益\u003c/span>\u003cb id=\"sRet\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>买入持有收益\u003c/span>\u003cb id=\"sBH\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>最大回撤\u003c/span>\u003cb id=\"sDD\">–\u003c/b>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cspan>持仓天数占比\u003c/span>\u003cb id=\"sExp\">–\u003c/b>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"note\" id=\"verdict\">\u003c/div>\n\n\u003cscript>\n(function(){\n  const DAYS = 240, SIZE = 1000, RATIO = 0.5625;\n  let seed = 20260921;\n  function rnd(){ // mulberry32\n    seed = (seed + 0x6D2B79F5) >>> 0;\n    let t = seed;\n    t = Math.imul(t ^ (t >>> 15), t | 1);\n    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  }\n  function gauss(){ let u = 0, v = 0; while(u === 0) u = rnd(); while(v === 0) v = rnd();\n    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }\n\n  function genPrices(mode){\n    const p = [100]; const base = 100;\n    for(let i=1;i\u003cDAYS;i++){\n      let drift = 0, vol = 0.013, mr = 0;\n      if(mode === 'trend'){ drift = 0.0022; }\n      else if(mode === 'range'){ vol = 0.011; mr = 0.06; }\n      else { const half = DAYS*0.5;\n        if(i \u003c half){ drift = 0.0028; } else { vol = 0.011; mr = 0.07; } }\n      const noise = gauss()*vol;\n      const pull = mr * Math.log(base / p[i-1]);      // 均值回复拉力\n      p.push(Math.max(20, p[i-1] * Math.exp(drift + noise + pull)));\n    }\n    return p;\n  }\n  function sma(arr, n){\n    const out = new Array(arr.length).fill(null); let sum = 0;\n    for(let i=0;i\u003carr.length;i++){\n      sum += arr[i];\n      if(i >= n) sum -= arr[i-n];\n      if(i >= n-1) out[i] = sum/n;\n    }\n    return out;\n  }\n  function run(px, nf, ns, feeBp){\n    const f = sma(px, nf), s = sma(px, ns);\n    let pos = 0, entryPx = 0, entryIdx = 0, equity = 1, bh = 1;\n    const eq = [1], bhArr = [1], sig = [];\n    const trades = []; let heldDays = 0;\n    for(let i=1;i\u003cpx.length;i++){\n      const ret = px[i]/px[i-1] - 1;\n      if(pos === 1){ equity *= (1 + ret); heldDays++; }\n      bh *= (1 + ret);\n      // 收盘判定信号，下一根生效\n      if(f[i] !== null && s[i] !== null && f[i-1] !== null && s[i-1] !== null){\n        const crossUp = f[i-1] \u003c= s[i-1] && f[i] > s[i];\n        const crossDown = f[i-1] >= s[i-1] && f[i] \u003c s[i];\n        if(crossUp && pos === 0){\n          pos = 1; entryPx = px[i]; entryIdx = i;\n          equity *= (1 - feeBp/10000);\n          sig.push({i, kind:'buy'});\n        } else if(crossDown && pos === 1){\n          pos = 0;\n          equity *= (1 - feeBp/10000);\n          const r = px[i]/entryPx - 1 - 2*feeBp/10000;\n          trades.push({entryIdx, exitIdx:i, ret:r});\n          sig.push({i, kind:'sell'});\n        }\n      }\n      eq.push(equity); bhArr.push(bh);\n    }\n    const wins = trades.filter(t=>t.ret>0).length;\n    let peak = 1, mdd = 0;\n    eq.forEach(v=>{ peak = Math.max(peak, v); mdd = Math.min(mdd, v/peak - 1); });\n    return {f, s, eq, bhArr, sig, trades, win: trades.length ? wins/trades.length : 0,\n            ret: equity-1, bh: bh-1, mdd, exposure: heldDays/(px.length-1)};\n  }\n  function draw(cv, h){\n    const dpr = window.devicePixelRatio || 1;\n    const w = cv.clientWidth || 700;\n    cv.width = w*dpr; cv.height = h*dpr;\n    const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);\n    return {ctx, w, h};\n  }\n  function axes(ctx, w, h, pad, lo, hi, n){\n    ctx.strokeStyle='#e3e6ea'; ctx.lineWidth=1; ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle='#9aa3af';\n    for(let g=0; g\u003c=4; g++){\n      const y = pad.t + (h-pad.t-pad.b)*g/4;\n      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();\n      const v = hi - (hi-lo)*g/4;\n      ctx.fillText(v.toFixed(lo>1?1:2), 4, y+3);\n    }\n  }\n  function render(){\n    const mode = document.getElementById('mode').value;\n    const nf = +document.getElementById('fast').value, ns = +document.getElementById('slow').value;\n    const fee = +document.getElementById('fee').value;\n    document.getElementById('lbF').textContent = nf;\n    document.getElementById('lbS').textContent = ns;\n    document.getElementById('lbFee').textContent = fee;\n\n    const px = genPrices(mode);\n    const r = run(px, Math.min(nf,ns-1), ns, fee);\n\n    // ---- 价格图 ----\n    const pad = {l:38, r:10, t:10, b:16};\n    const A = draw(document.getElementById('price'), 230);\n    const all = px.concat(r.s.filter(v=>v!==null), r.f.filter(v=>v!==null));\n    let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);\n    const sp = (hi-lo)*0.06; lo -= sp; hi += sp;\n    const X = i => pad.l + (A.w-pad.l-pad.r)*i/(px.length-1);\n    const Y = v => pad.t + (A.h-pad.t-pad.b)*(hi-v)/(hi-lo);\n    axes(A.ctx, A.w, A.h, pad, lo, hi);\n    A.ctx.strokeStyle='#9aa3af'; A.ctx.lineWidth=1.4; A.ctx.beginPath();\n    px.forEach((v,i)=>{ i?A.ctx.lineTo(X(i),Y(v)):A.ctx.moveTo(X(i),Y(v)); }); A.ctx.stroke();\n    const line = (arr, color, wd)=>{\n      A.ctx.strokeStyle=color; A.ctx.lineWidth=wd; A.ctx.beginPath(); let started=false;\n      arr.forEach((v,i)=>{ if(v===null) return; if(!started){A.ctx.moveTo(X(i),Y(v));started=true;} else A.ctx.lineTo(X(i),Y(v)); });\n      A.ctx.stroke();\n    };\n    line(r.f, '#d93a2b', 1.6); line(r.s, '#2f6fdb', 1.6);\n    r.sig.forEach(sg=>{\n      const x = X(sg.i), y = Y(px[sg.i]);\n      A.ctx.fillStyle = sg.kind==='buy' ? '#d93a2b' : '#12a05c';\n      A.ctx.beginPath();\n      if(sg.kind==='buy'){ A.ctx.moveTo(x, y-13); A.ctx.lineTo(x-5, y-3); A.ctx.lineTo(x+5, y-3); }\n      else { A.ctx.moveTo(x, y+13); A.ctx.lineTo(x-5, y+3); A.ctx.lineTo(x+5, y+3); }\n      A.ctx.closePath(); A.ctx.fill();\n    });\n\n    // ---- 资金曲线 ----\n    const B = draw(document.getElementById('equity'), 150);\n    const all2 = r.eq.concat(r.bhArr);\n    let lo2 = Math.min.apply(null, all2), hi2 = Math.max.apply(null, all2);\n    const sp2 = (hi2-lo2)*0.08 || 0.05; lo2 -= sp2; hi2 += sp2;\n    const X2 = i => pad.l + (B.w-pad.l-pad.r)*i/(r.eq.length-1);\n    const Y2 = v => pad.t + (B.h-pad.t-pad.b)*(hi2-v)/(hi2-lo2);\n    axes(B.ctx, B.w, B.h, pad, lo2, hi2);\n    const pl = (arr, color, dash)=>{\n      B.ctx.strokeStyle=color; B.ctx.lineWidth=1.6; B.ctx.setLineDash(dash||[]); B.ctx.beginPath();\n      arr.forEach((v,i)=>{ i?B.ctx.lineTo(X2(i),Y2(v)):B.ctx.moveTo(X2(i),Y2(v)); }); B.ctx.stroke(); B.ctx.setLineDash([]);\n    };\n    pl(r.bhArr, '#9aa3af', [4,3]); pl(r.eq, '#d93a2b');\n\n    // ---- 指标 ----\n    const pct = v => (v*100).toFixed(1) + '%';\n    const set = (id, txt, val)=>{ const el = document.getElementById(id); el.textContent = txt;\n      if(val !== undefined) el.className = val >= 0 ? 'pos' : 'neg'; };\n    document.getElementById('sTrades').textContent = r.trades.length;\n    document.getElementById('sWin').textContent = r.trades.length ? pct(r.win) : '—';\n    set('sRet', pct(r.ret), r.ret);\n    set('sBH', pct(r.bh), r.bh);\n    set('sDD', pct(r.mdd), r.mdd);\n    document.getElementById('sExp').textContent = pct(r.exposure);\n    const verdict = mode === 'trend'\n      ? '单边趋势下：金叉/死叉能吃到主升段，回撤主要来自均线滞后造成的顶部回吐。'\n      : mode === 'range'\n        ? '震荡横盘下：价格反复穿越均线，手续费与滑点持续侵蚀本金——这正是趋势策略的\"磨损区\"。'\n        : '先趋势后震荡：前段盈利、后段回吐，说明趋势策略必须配合\"行情判别 + 止损\"才能在切换期活下来。';\n    document.getElementById('verdict').textContent = verdict + '（本模拟用合成行情，仅用于理解机制，不代表任何真实收益。）';\n  }\n  ['mode','fast','slow','fee'].forEach(id=>{\n    document.getElementById(id).addEventListener('input', render);\n  });\n  document.getElementById('fast').addEventListener('input', ()=>{\n    const f = document.getElementById('fast'), s = document.getElementById('slow');\n    if(+f.value >= +s.value) s.value = String(+f.value + 5);\n    render();\n  });\n  document.getElementById('slow').addEventListener('input', ()=>{\n    const f = document.getElementById('fast'), s = document.getElementById('slow');\n    if(+s.value \u003c= +f.value) f.value = String(Math.max(3, +s.value - 5));\n    render();\n  });\n  document.getElementById('regen').addEventListener('click', ()=>{ seed = (seed*7919 + 104729) >>> 0; render(); });\n  window.addEventListener('resize', render);\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}},{"id":"sc-11","stageId":"stg-quant-strategy-taxonomy","title":"多因子选股：四类因子与其经济解释","order":11,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-11-sp","type":"speech","text":"第三类，也是机构最主流的做法：多因子选股。它不做择时，而是每天或每月给全市场股票打分，买入分数最高的一篮子。因子大致分四类——价值、成长、技术量价、质量。每一类都对应一种\"为什么能赚钱\"的经济解释：便宜、增长、交易行为、财务稳健。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-11.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-11-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-11-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第四节 · 多因子选股\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-11-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">机构的流水线：不择时，批量打分选股\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-11-c1","type":"text","left":56,"top":165,"width":208,"height":201,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">① 价值因子\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">PE、PB、PCF、股息率\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">买低估值、高分红\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">长期有效，但短期可能长期跑输\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-11-c2","type":"text","left":280,"top":165,"width":208,"height":201,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">② 成长因子\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">营收增速、净利润增速、ROE\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">买业绩高速增长的企业\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">风险：增速预期落空时的估值双杀\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#e9f7f1"},{"id":"sc-11-c3","type":"text","left":504,"top":165,"width":208,"height":201,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">③ 技术量价因子\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">波动率、换手率、动量、反转、资金流向\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">换手快、容量有限\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">需严格控制换手成本\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-11-c4","type":"text","left":728,"top":165,"width":216,"height":201,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">④ 质量因子\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">毛利率、资产负债率、经营现金流\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">筛掉\"看着便宜但会出事\"的公司\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">是价值因子的重要补充\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f2eefd"},{"id":"sc-11-c5","type":"text","left":56,"top":378,"width":888,"height":157,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">四类因子的关系：不是并列，而是互相校正\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">价值与成长常呈相反暴露：便宜的公司往往增长慢——同时用两类因子，组合不会极端偏向某一种风格；\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">技术量价因子提供短期择时的边际信息，但换手最快、成本最敏感；\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">质量因子负责\"排雷\"：它本身很少贡献超额收益，却显著降低价值陷阱得手的概率。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"}],"script":"第三类，也是机构最主流的做法：多因子选股。它不做择时，而是每天或每月给全市场股票打分，买入分数最高的一篮子。因子大致分四类——价值、成长、技术量价、质量。每一类都对应一种\"为什么能赚钱\"的经济解释：便宜、增长、交易行为、财务稳健。"}}},{"id":"sc-12","stageId":"stg-quant-strategy-taxonomy","title":"多因子的流程与两种形态","order":12,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-12-sp","type":"speech","text":"有了因子，接下来是流程和形态。流程五步：全市场按因子打分、每个因子做横截面标准化、加权合成综合分、取前 N 名建组合、定期调仓并控制行业与个股上限。形态有两种：公募式的纯多头，只能买不能空，赚\"选股 + 市场\"两份钱；私募式的市场中性，高分股做多、低分股做空，把大盘涨跌对冲掉，只赚选股能力，代价是需要做空工具、成本更高。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-12.mp3"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-12-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-12-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第四节 · 流程与形态\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-12-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">从因子到组合：五步流水线，两种产品形态\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-12-c5","type":"text","left":56,"top":165,"width":430,"height":234,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">策略流程（每月调仓）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">① 全市场股票按四类因子打分\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">② 每个因子做横截面标准化（去量纲）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">③ 加权合成综合分（权重来自历史检验，而非拍脑袋）\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">④ 取前 20 / 50 / 100 名，等权或按分数加权\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">⑤ 定期调仓，控制单行业与单票上限\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"},{"id":"sc-12-c6","type":"text","left":508,"top":165,"width":436,"height":234,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">两种形态：纯多头 vs 市场中性\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">纯多头（公募主流）：\u003c/span>只买高分股，赚\"选股 + 市场\"两份钱\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">\u003cspan style=\"font-weight:700;color:#0f172a;\">市场中性（私募对冲）：\u003c/span>高分股做多、低分股做空，对冲掉大盘涨跌，只赚选股 Alpha\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">代价：中性组合需要做空工具、成本更高，收益也更依赖因子质量\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#eef3fd"},{"id":"sc-12-c7","type":"text","left":56,"top":411,"width":888,"height":130,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#0f172a;font-weight:700;text-align:left;margin-bottom:8px;\">调仓频率与成本：为什么\"月度调仓\"最常见\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">调仓越频繁 → 因子信息利用越充分，但换手成本、冲击成本与容量问题同步放大；\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">月度调仓是成本与信息效率的折中点，评估任何多因子策略都要先问：换手率多少、单边成本假设多少、扣完成本还剩多少超额。\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#f7f8fa"}],"script":"有了因子，接下来是流程和形态。流程五步：全市场按因子打分、每个因子做横截面标准化、加权合成综合分、取前 N 名建组合、定期调仓并控制行业与个股上限。形态有两种：公募式的纯多头，只能买不能空，赚\"选股 + 市场\"两份钱；私募式的市场中性，高分股做多、低分股做空，把大盘涨跌对冲掉，只赚选股能力，代价是需要做空工具、成本更高。"}}},{"id":"sc-13","stageId":"stg-quant-strategy-taxonomy","title":"因子研究的四个工程陷阱","order":13,"type":"slide","createdAt":1790006400000,"updatedAt":1790006400000,"actions":[{"id":"sc-13-sp","type":"speech","text":"多因子的难点不在公式，而在工程细节。第一，时点对齐：财报是四月公布的，你却在三月用上了全年利润，这叫前视偏差，会让回测收益凭空翻倍。第二，幸存者偏差：退市和更名的股票如果被剔除，历史收益就被系统性高估。第三，中性化：不剥离行业和市值的影响，你的\"因子\"可能只是在赌小盘股。第四，换手成本：高换手因子在扣掉手续费和冲击成本之后，超额收益常常所剩无几。","voice":"onyx","speed":1,"audioUrl":"/api/classroom-media/3sOfKmAXql/audio/sc-13.mp3"},{"id":"sc-13-sp2","type":"spotlight","elementId":"sc-13-c1","description":"强调前视偏差是最常见的回测造假来源"}],"content":{"type":"slide","schemaVersion":1,"canvas":{"id":"sc-13-canvas","viewportSize":1000,"viewportRatio":0.5625,"theme":{"backgroundColor":"#ffffff","themeColors":["#2f6fdb","#d93a2b","#12a05c","#f59e0b","#a855f7"],"fontColor":"#1f2937","fontName":"Microsoft YaHei"},"background":{"type":"solid","color":"#ffffff"},"elements":[{"id":"sc-13-kick","type":"text","left":56,"top":26,"width":890,"height":40,"rotate":0,"content":"\u003cp style=\"font-size:13px;line-height:1.5;color:#2f6fdb;font-weight:700;text-align:left;margin-bottom:0px;\">第四节 · 工程细节\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-13-title","type":"text","left":56,"top":78,"width":890,"height":75,"rotate":0,"content":"\u003cp style=\"font-size:26px;line-height:1.5;color:#0b1220;font-weight:700;text-align:left;margin-bottom:0px;\">因子本身不难，难的是别把回测做出\"假钱\"\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4},{"id":"sc-13-c1","type":"text","left":56,"top":165,"width":208,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b3261e;font-weight:700;text-align:left;margin-bottom:8px;\">① 前视偏差\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">用尚未公布的财报数据 → 回测虚高\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">纪律：按\u003cstrong>公告日\u003c/strong>而非报告期对齐数据\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">同一财务数据，公告日与报告期可能差几个月\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdeceb"},{"id":"sc-13-c2","type":"text","left":280,"top":165,"width":208,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b3261e;font-weight:700;text-align:left;margin-bottom:8px;\">② 幸存者偏差\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">只看今天还活着的股票 → 剔除了退市样本\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">后果：历史收益被系统性高估\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">纪律：使用包含退市、更名的全历史成分股数据库\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdeceb"},{"id":"sc-13-c3","type":"text","left":504,"top":165,"width":208,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">③ 行业市值中性化\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">不剥离行业/市值 → 因子可能只是风格暴露\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">典型伪因子：低 PE 恰好等于\"小盘股\"\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-weight:400;text-align:left;margin-bottom:5px;\">纪律：横截面回归剔除行业与市值，再看残差因子\u003c/p>","defaultFontName":"Microsoft YaHei","defaultColor":"#1f2937","lineHeight":1.5,"wordSpace":0,"paragraphSpace":4,"fill":"#fdf3e7"},{"id":"sc-13-c4","type":"text","left":728,"top":165,"width":216,"height":223,"rotate":0,"content":"\u003cp style=\"font-size:15px;line-height:1.5;color:#b45309;font-weight:700;text-align:left;margin-bottom:8px;\">④ 换手与成本\u003c/p>\u003cp style=\"font-size:14px;line-height:1.45;color:#4b5563;font-we
